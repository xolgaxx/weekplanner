<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olgenda - Weekplanner & Agenda</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: {
                            50: '#fbf9f5',
                            100: '#f4efe6',
                            200: '#e6ded0',
                            300: '#d1c4b2',
                            400: '#b8a691',
                            500: '#8c7a6b',
                            600: '#78614e',
                            700: '#5c4a38',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(140, 122, 107, 0.08)',
                        'card': '0 2px 12px 0 rgba(0, 0, 0, 0.04)'
                    }
                }
            }
        }
    </script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome voor iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            background-color: #fbf9f5;
            color: #5c4a38;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }
        .custom-card {
            background: #ffffff;
            border: 1px solid #e6ded0;
            border-radius: 1rem;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }
        .custom-card:hover {
            box-shadow: 0 4px 20px -2px rgba(140, 122, 107, 0.1);
        }
        .checkbox-circle {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #b8a691;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .checkbox-circle.checked {
            background-color: #8c7a6b;
            border-color: #8c7a6b;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Auth Scherm (Login / Register) -->
    <div id="auth-screen" class="fixed inset-0 bg-beige-50 z-50 flex items-center justify-center p-4">
        <div class="custom-card bg-white p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold tracking-tight text-beige-700 mb-2">Olgenda</h1>
                <p class="text-beige-500 text-sm">Jouw minimalistische digitale levensplanner</p>
            </div>
            <div id="auth-error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg"></div>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-beige-500 mb-1">E-mailadres</label>
                    <input type="email" id="auth-email" required class="w-full px-4 py-2.5 rounded-xl border border-beige-200 focus:outline-none focus:ring-2 focus:ring-beige-400 text-sm bg-beige-50/50">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-beige-500 mb-1">Wachtwoord</label>
                    <input type="password" id="auth-password" required class="w-full px-4 py-2.5 rounded-xl border border-beige-200 focus:outline-none focus:ring-2 focus:ring-beige-400 text-sm bg-beige-50/50">
                </div>
                <div class="flex items-center justify-between text-xs">
                    <button type="button" id="btn-forgot-password" class="text-beige-500 hover:underline">Wachtwoord vergeten?</button>
                    <button type="button" id="auth-toggle-mode" class="text-beige-700 font-semibold hover:underline">Nog geen account? Registreer</button>
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-beige-700 text-white rounded-xl font-medium hover:bg-beige-600 transition shadow-sm text-sm">Inloggen</button>
            </form>
        </div>
    </div>

    <!-- Hoofdapplicatie -->
    <div id="app-container" class="flex-1 flex flex-col hidden">
        <!-- Header -->
        <header class="w-full bg-white border-b border-beige-200 py-4 px-6 mb-6 shadow-sm sticky top-0 z-30">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <!-- Logo & Profiel -->
                    <div id="header-profile-container" class="flex items-center space-x-3">
                        <img id="header-avatar-img" src="" alt="Profielfoto" class="w-10 h-10 rounded-full object-cover border border-beige-300 hidden">
                        <div>
                            <h1 id="header-logo-text" class="text-2xl font-bold tracking-tight text-beige-700">Olgenda</h1>
                            <span class="text-xs bg-beige-100 text-beige-600 px-2.5 py-1 rounded-full font-medium">Digital Life Planner</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="btn-settings-open" class="text-xs bg-beige-100 hover:bg-beige-200 text-beige-700 px-3.5 py-2 rounded-xl transition-colors font-medium flex items-center space-x-1.5">
                        <i class="fa-solid fa-gear"></i>
                        <span>Instellingen</span>
                    </button>
                    <button id="logout-btn" class="text-xs bg-beige-100 hover:bg-red-50 text-beige-700 hover:text-red-600 px-3 py-2 rounded-xl transition-colors font-medium">Uitloggen</button>
                </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="max-w-7xl mx-auto w-full px-4 flex-grow grid grid-cols-1 lg:grid-cols-4 gap-6 pb-12">
            
            <!-- Linkerkant / Weekplanner (3 kolommen breed) -->
            <section class="lg:col-span-3 space-y-6">
                <!-- Week Navigatie & Acties -->
                <div class="custom-card p-4 flex flex-wrap justify-between items-center gap-4">
                    <div class="flex items-center space-x-2">
                        <button id="prev-week" class="p-2 rounded-lg hover:bg-beige-100 text-beige-600 transition-colors"><i class="fa-solid fa-chevron-left"></i></button>
                        <span id="current-week-label" class="font-semibold text-lg text-beige-700">Week --</span>
                        <button id="next-week" class="p-2 rounded-lg hover:bg-beige-100 text-beige-600 transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
                        <button id="today-btn" class="text-xs bg-beige-100 hover:bg-beige-200 text-beige-700 px-3 py-1.5 rounded-lg transition-colors font-medium ml-2">Vandaag</button>
                    </div>
                    <div class="flex items-center space-x-3">
                        <select id="category-filter" class="px-3 py-1.5 text-xs rounded-xl border border-beige-200 bg-beige-50 text-beige-700 focus:outline-none">
                            <option value="">Alle categorieën</option>
                        </select>
                        <button id="open-add-modal" class="bg-beige-700 hover:bg-beige-600 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition-all flex items-center space-x-2">
                            <i class="fa-solid fa-plus"></i>
                            <span>Nieuw Item Inplannen</span>
                        </button>
                    </div>
                </div>

                <!-- Dagen Raster (Dynamisch Maandag t/m Zondag) -->
                <div id="week-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Wordt dynamisch gevuld -->
                </div>
            </section>

            <!-- Rechterkolom / Widgets (1 kolom breed) -->
            <aside class="space-y-6">
                <!-- Notitieblok Widget -->
                <div id="widget-notepad" class="custom-card p-5">
                    <h3 class="font-semibold text-beige-700 mb-3 flex items-center space-x-2">
                        <i class="fa-solid fa-note-sticky text-beige-500"></i>
                        <span>Notitieblok</span>
                    </h3>
                    <textarea id="notepad-input" rows="4" class="w-full p-3 text-sm border border-beige-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-beige-400 bg-beige-50/50 resize-none text-beige-700" placeholder="Schrijf hier je snelle notities..."></textarea>
                </div>

                <!-- Boodschappenlijst / Checklist Widget met Ronde Bolletjes -->
                <div id="widget-checklist" class="custom-card p-5">
                    <h3 class="font-semibold text-beige-700 mb-3 flex items-center space-x-2">
                        <i class="fa-solid fa-list-check text-beige-500"></i>
                        <span>Boodschappenlijst</span>
                    </h3>
                    <div class="flex space-x-2 mb-3">
                        <input type="text" id="checklist-item-input" placeholder="Nieuw item..." class="flex-grow px-3 py-1.5 text-sm border border-beige-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-beige-400 bg-beige-50/50">
                        <button id="add-checklist-btn" class="bg-beige-600 hover:bg-beige-700 text-white px-3.5 py-1.5 rounded-xl text-sm transition-colors"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <ul id="checklist-container" class="space-y-2.5 text-sm">
                        <!-- Wordt dynamisch gevuld -->
                    </ul>
                </div>
            </aside>
        </main>
    </div>

    <!-- Instellingen Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="custom-card bg-white max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-beige-100 pb-3">
                <h3 class="font-bold text-beige-700 text-lg">Instellingen & Profiel</h3>
                <button id="settings-modal-close" class="text-beige-400 hover:text-beige-700 font-bold">✕</button>
            </div>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-beige-500 mb-1">Jouw Naam / Titel</label>
                    <input type="text" id="setting-name-input" class="w-full px-3 py-2 rounded-xl border border-beige-200 bg-beige-50/50" placeholder="Bijv. Olga's Planner">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-beige-500 mb-1">Profielfoto Uploaden</label>
                    <input type="file" id="setting-avatar-input" accept="image/*" class="w-full text-xs text-beige-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-beige-100 file:text-beige-700 hover:file:bg-beige-200">
                </div>
                <div class="flex justify-end space-x-2 pt-2 border-t border-beige-100">
                    <button id="settings-modal-save" class="px-4 py-2 bg-beige-700 text-white rounded-xl text-xs font-medium hover:bg-beige-600">Opslaan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Item Modal (Inplannen met 5-minuten stappen) -->
    <div id="item-modal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="custom-card bg-white max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-beige-100 pb-3">
                <h3 id="item-modal-title" class="font-bold text-beige-700 text-lg">Nieuw Item Inplannen</h3>
                <button id="item-modal-close" class="text-beige-400 hover:text-beige-700 font-bold">✕</button>
            </div>
            <form id="item-form" class="space-y-4 text-sm">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-beige-500 mb-1">Onderwerp / Taak</label>
                    <input type="text" id="item-title" required class="w-full px-3 py-2 rounded-xl border border-beige-200 focus:outline-none focus:ring-2 focus:ring-beige-400 bg-beige-50/50">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-beige-500 mb-1">Datum</label>
                        <input type="date" id="item-date" required class="w-full px-3 py-2 rounded-xl border border-beige-200 bg-beige-50/50">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-beige-500 mb-1">Starttijd (per 5 min)</label>
                        <input type="time" id="item-time" step="300" class="w-full px-3 py-2 rounded-xl border border-beige-200 bg-beige-50/50">
                    </div>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" id="item-modal-cancel" class="px-4 py-2 text-beige-600 hover:bg-beige-100 rounded-xl text-xs font-medium">Annuleren</button>
                    <button type="submit" class="px-4 py-2 bg-beige-700 text-white rounded-xl text-xs font-medium hover:bg-beige-600">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logica -->
    <script>
        let currentWeekOffset = 0;
        let plannerItems = [
            { id: 1, title: 'Koffie drinken met vriendin', date: new Date().toISOString().split('T')[0], time: '10:00' }
        ];

        let checklistItems = [
            { id: 1, text: 'Havermelk en bananen halen', done: false },
            { id: 2, text: 'Weekboodschappen bio-markt', done: true }
        ];

        let settings = {
            name: 'Olgenda',
            avatarImg: ''
        };

        // Inlog simulatie
        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            initApp();
        });

        document.getElementById('auth-toggle-mode').addEventListener('click', () => {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            initApp();
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        });

        function initApp() {
            renderWeekPlanner();
            renderChecklist();
            applySettingsUI();
        }

        // Dagen raster genereren (Maandag t/m Zondag)
        function getStartOfWeek(offset = 0) {
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(now.getFullYear(), now.getMonth(), diff + (offset * 7));
            monday.setHours(0,0,0,0);
            return monday;
        }

        function renderWeekPlanner() {
            const grid = document.getElementById('week-grid');
            grid.innerHTML = '';
            
            const startMonday = getStartOfWeek(currentWeekOffset);
            const weekNumber = getWeekNumber(startMonday);
            document.getElementById('current-week-label').innerText = `Week ${weekNumber}`;

            const days = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];
            
            days.forEach((dayName, index) => {
                const currentDayDate = new Date(startMonday);
                currentDayDate.setDate(startMonday.getDate() + index);
                const dateString = currentDayDate.toISOString().split('T')[0];
                const isToday = new Date().toISOString().split('T')[0] === dateString;

                const dayCard = document.createElement('div');
                dayCard.className = `custom-card p-4 flex flex-col justify-between ${isToday ? 'ring-2 ring-beige-400 bg-beige-50/30' : 'bg-white'}`;
                
                // Filter items voor deze dag
                const dayItems = plannerItems.filter(item => item.date === dateString);

                let itemsHtml = dayItems.map(item => `
                    <div class="bg-beige-50 border border-beige-200 rounded-lg p-2.5 text-xs flex justify-between items-center mb-2">
                        <div>
                            <span class="font-semibold text-beige-700">${item.title}</span>
                            ${item.time ? `<div class="text-beige-500 text-[10px]"><i class="fa-regular fa-clock"></i> ${item.time}</div>` : ''}
                        </div>
                        <button onclick="removeItem(${item.id})" class="text-beige-400 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');

                if (dayItems.length === 0) {
                    itemsHtml = `<p class="text-xs text-beige-400 italic py-2">Geen plannen</p>`;
                }

                dayCard.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3 pb-2 border-b border-beige-100">
                            <span class="font-bold text-beige-700 text-sm">${dayName}</span>
                            <span class="text-xs text-beige-500">${currentDayDate.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' })}</span>
                        </div>
                        <div class="space-y-1">${itemsHtml}</div>
                    </div>
                    <button onclick="openAddModalForDate('${dateString}')" class="mt-3 w-full py-1.5 bg-beige-50 hover:bg-beige-100 text-beige-700 rounded-lg text-xs font-medium transition-colors border border-beige-200 flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span>Taak toevoegen</span>
                    </button>
                `;
                grid.appendChild(dayCard);
            });
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
            return weekNo;
        }

        // Week navigatie knoppen
        document.getElementById('prev-week').addEventListener('click', () => { currentWeekOffset--; renderWeekPlanner(); });
        document.getElementById('next-week').addEventListener('click', () => { currentWeekOffset++; renderWeekPlanner(); });
        document.getElementById('today-btn').addEventListener('click', () => { currentWeekOffset = 0; renderWeekPlanner(); });

        // Checklist logica
        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = '';
            checklistItems.forEach((item) => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between group py-1';
                li.innerHTML = `
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="toggleChecklistItem(${item.id})">
                        <div class="checkbox-circle ${item.done ? 'checked' : ''}">
                            ${item.done ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </div>
                        <span class="text-sm ${item.done ? 'line-through text-beige-400' : 'text-beige-700'}">${item.text}</span>
                    </div>
                    <button onclick="removeChecklistItem(${item.id})" class="text-beige-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-trash-can text-xs"></i></button>
                `;
                container.appendChild(li);
            });
        }

        window.toggleChecklistItem = function(id) {
            const item = checklistItems.find(i => i.id === id);
            if (item) {
                item.done = !item.done;
                if (item.done) confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
                renderChecklist();
            }
        };

        window.removeChecklistItem = function(id) {
            checklistItems = checklistItems.filter(i => i.id !== id);
            renderChecklist();
        };

        document.getElementById('add-checklist-btn').addEventListener('click', () => {
            const input = document.getElementById('checklist-item-input');
            if (input.value.trim()) {
                checklistItems.push({ id: Date.now(), text: input.value.trim(), done: false });
                input.value = '';
                renderChecklist();
            }
        });

        // Item toevoegen modal
        window.openAddModalForDate = function(dateStr) {
            document.getElementById('item-date').value = dateStr;
            document.getElementById('item-title').value = '';
            document.getElementById('item-time').value = '';
            document.getElementById('item-modal').classList.remove('hidden');
        };

        document.getElementById('open-add-modal').addEventListener('click', () => {
            document.getElementById('item-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('item-modal').classList.remove('hidden');
        });

        document.getElementById('item-modal-close').addEventListener('click', () => { document.getElementById('item-modal').classList.add('hidden'); });
        document.getElementById('item-modal-cancel').addEventListener('click', () => { document.getElementById('item-modal').classList.add('hidden'); });

        document.getElementById('item-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('item-title').value;
            const date = document.getElementById('item-date').value;
            const time = document.getElementById('item-time').value;

            plannerItems.push({ id: Date.now(), title, date, time });
            document.getElementById('item-modal').classList.add('hidden');
            renderWeekPlanner();
        });

        window.removeItem = function(id) {
            plannerItems = plannerItems.filter(i => i.id !== id);
            renderWeekPlanner();
        };

        // Instellingen Modal logica & Profielfoto
        document.getElementById('btn-settings-open').addEventListener('click', () => {
            document.getElementById('setting-name-input').value = settings.name;
            document.getElementById('settings-modal').classList.remove('hidden');
        });
        document.getElementById('settings-modal-close').addEventListener('click', () => { document.getElementById('settings-modal').classList.add('hidden'); });

        document.getElementById('setting-avatar-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    settings.avatarImg = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('settings-modal-save').addEventListener('click', () => {
            settings.name = document.getElementById('setting-name-input').value || 'Olgenda';
            applySettingsUI();
            document.getElementById('settings-modal').classList.add('hidden');
        });

        function applySettingsUI() {
            document.getElementById('header-logo-text').innerText = settings.name;
            const avatarImg = document.getElementById('header-avatar-img');
            if (settings.avatarImg) {
                avatarImg.src = settings.avatarImg;
                avatarImg.classList.remove('hidden');
            } else {
                avatarImg.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
