<!DOCTYPE html>
<html lang="nl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olgenda - Aesthetic Beige Weekplanner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        beige: {
                            50: '#fbf9f5',
                            100: '#f5f2eb',
                            200: '#eae4d9',
                            300: '#d9cebc',
                            400: '#bcae99',
                            500: '#8c7a6b',
                            600: '#78614e',
                            700: '#5c4a38',
                            800: '#47392b',
                            900: '#33281e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fbf9f5;
            color: #47392b;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f5f2eb;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #bcae99;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #8c7a6b;
        }
        .task-card {
            transition: all 0.2s ease;
        }
        .task-card:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="h-full flex flex-col bg-[#fbf9f5] text-[#47392b] selection:bg-[#d9cebc] selection:text-[#33281e]">

    <!-- Header / Navigation -->
    <header class="bg-white/80 backdrop-blur-md border-b border-[#eae4d9] sticky top-0 z-30 px-4 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-[#8c7a6b] flex items-center justify-center text-white shadow-sm font-semibold tracking-wider text-lg">
                O
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-[#47392b] flex items-center gap-2">
                    Olgenda <span class="text-xs px-2 py-0.5 rounded-full bg-[#f5f2eb] text-[#78614e] font-medium border border-[#eae4d9]">Beige Aesthetic</span>
                </h1>
                <p class="text-xs text-[#8c7a6b]">Jouw rustige, stijlvolle weekplanner</p>
            </div>
        </div>

        <!-- Week Navigation -->
        <div class="flex items-center space-x-2 bg-[#f5f2eb] p-1.5 rounded-xl border border-[#eae4d9]">
            <button onclick="changeWeek(-1)" class="w-8 h-8 rounded-lg flex items-center justify-center text-[#78614e] hover:bg-white hover:shadow-sm transition" title="Vorige week">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <button onclick="goToCurrentWeek()" class="px-3 py-1 rounded-lg text-xs font-medium text-[#78614e] hover:bg-white hover:shadow-sm transition">
                Vandaag
            </button>
            <span id="currentWeekRange" class="px-3 text-xs font-semibold text-[#47392b] min-w-[160px] text-center">Loading...</span>
            <button onclick="changeWeek(1)" class="w-8 h-8 rounded-lg flex items-center justify-center text-[#78614e] hover:bg-white hover:shadow-sm transition" title="Volgende week">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>

        <!-- Actions & User profile -->
        <div class="flex items-center space-x-3">
            <button onclick="openModal('taskModal')" class="bg-[#78614e] hover:bg-[#5c4a38] text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-sm flex items-center gap-2 transition">
                <i class="fa-solid fa-plus"></i> Nieuwe Taak
            </button>
            <button onclick="toggleWidgetPanel()" class="w-9 h-9 rounded-xl bg-[#f5f2eb] hover:bg-[#eae4d9] text-[#78614e] flex items-center justify-center border border-[#eae4d9] transition" title="Widgets">
                <i class="fa-solid fa-sliders"></i>
            </button>
            <button onclick="openModal('settingsModal')" class="w-9 h-9 rounded-xl bg-[#f5f2eb] hover:bg-[#eae4d9] text-[#78614e] flex items-center justify-center border border-[#eae4d9] transition" title="Instellingen">
                <i class="fa-solid fa-gear"></i>
            </button>
            
            <!-- Auth Section -->
            <div id="authContainer" class="flex items-center pl-2 border-l border-[#eae4d9]">
                <button id="loginBtn" onclick="loginWithGoogle()" class="bg-white border border-[#eae4d9] hover:bg-[#f5f2eb] text-[#47392b] px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition shadow-sm">
                    <i class="fa-brands fa-google text-amber-700"></i> Inloggen
                </button>
                <div id="userProfile" class="hidden items-center space-x-2">
                    <img id="userAvatar" src="https://placehold.co/32x32/d9cebc/47392b?text=U" class="w-8 h-8 rounded-full border border-[#d9cebc]" alt="Avatar">
                    <button onclick="logout()" class="text-xs text-[#8c7a6b] hover:text-[#5c4a38] font-medium">Uitloggen</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Widgets (Collapsible / Left or Right) -->
        <aside id="widgetSidebar" class="w-80 bg-white border-r border-[#eae4d9] flex flex-col transition-all duration-300 z-20 overflow-y-auto custom-scrollbar">
            <div class="p-4 border-b border-[#eae4d9] flex items-center justify-between bg-[#fbf9f5]">
                <h2 class="text-sm font-bold text-[#47392b] flex items-center gap-2">
                    <i class="fa-solid fa-box-archive text-[#8c7a6b]"></i> Overzicht & Widgets
                </h2>
                <button onclick="toggleWidgetPanel()" class="text-[#8c7a6b] hover:text-[#47392b] text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-4 space-y-6">
                <!-- Mini Calendar Widget -->
                <div class="bg-[#fbf9f5] p-3 rounded-2xl border border-[#eae4d9]">
                    <div class="flex justify-between items-center mb-2">
                        <span id="miniCalMonth" class="text-xs font-bold text-[#47392b]">September 2026</span>
                        <div class="space-x-1">
                            <button onclick="changeMiniMonth(-1)" class="p-1 text-[#8c7a6b] hover:text-[#47392b]"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
                            <button onclick="changeMiniMonth(1)" class="p-1 text-[#8c7a6b] hover:text-[#47392b]"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                        </div>
                    </div>
                    <div id="miniCalendarGrid" class="grid grid-cols-7 gap-1 text-center text-[10px]">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <!-- Habits Tracker Widget -->
                <div class="bg-[#fbf9f5] p-3 rounded-2xl border border-[#eae4d9]">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold text-[#47392b] flex items-center gap-1.5">
                            <i class="fa-solid fa-seedling text-[#78614e]"></i> Gewoontes (Habits)
                        </h3>
                        <button onclick="openModal('habitModal')" class="text-[10px] bg-[#d9cebc]/50 hover:bg-[#d9cebc] px-2 py-0.5 rounded-lg text-[#5c4a38] font-medium transition">+ Nieuw</button>
                    </div>
                    <div id="habitsList" class="space-y-2">
                        <!-- Habits rendered here -->
                    </div>
                </div>

                <!-- Daily Checklist / Quick Notes -->
                <div class="bg-[#fbf9f5] p-3 rounded-2xl border border-[#eae4d9]">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold text-[#47392b] flex items-center gap-1.5">
                            <i class="fa-solid fa-list-check text-[#78614e]"></i> Takenlijstje
                        </h3>
                        <button onclick="addQuickChecklist()" class="text-[10px] text-[#8c7a6b] hover:text-[#47392b]"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div id="quickChecklistContainer" class="space-y-1.5">
                        <!-- Checklist items -->
                    </div>
                </div>

                <!-- Notes / Notepad Widget -->
                <div class="bg-[#fbf9f5] p-3 rounded-2xl border border-[#eae4d9]">
                    <h3 class="text-xs font-bold text-[#47392b] mb-2 flex items-center gap-1.5">
                        <i class="fa-solid fa-note-sticky text-[#78614e]"></i> Notitieblok
                    </h3>
                    <textarea id="notepadArea" oninput="saveNotepad()" placeholder="Snelle notities..." class="w-full h-24 text-xs bg-white border border-[#eae4d9] rounded-xl p-2.5 text-[#47392b] focus:outline-none focus:border-[#8c7a6b] resize-none"></textarea>
                </div>

                <!-- Birthdays Widget -->
                <div class="bg-[#fbf9f5] p-3 rounded-2xl border border-[#eae4d9]">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-bold text-[#47392b] flex items-center gap-1.5">
                            <i class="fa-solid fa-cake-candles text-[#78614e]"></i> Verjaardagen
                        </h3>
                        <button onclick="openModal('birthdayModal')" class="text-[10px] text-[#8c7a6b] hover:text-[#47392b]"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div id="birthdaysList" class="space-y-1.5 text-xs text-[#5c4a38]">
                        <!-- Birthdays populated here -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Week View Grid -->
        <main class="flex-1 flex flex-col overflow-x-auto overflow-y-auto bg-[#fbf9f5] p-4 lg:p-6 custom-scrollbar">
            <div id="weekGrid" class="grid grid-cols-1 md:grid-cols-7 gap-4 min-w-[900px] flex-1">
                <!-- Days generated via JavaScript -->
            </div>
        </main>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-[#eae4d9] overflow-hidden">
            <div class="px-6 py-4 border-b border-[#eae4d9] flex justify-between items-center bg-[#fbf9f5]">
                <h3 id="taskModalTitle" class="text-sm font-bold text-[#47392b]">Nieuwe Taak Toevoegen</h3>
                <button onclick="closeModal('taskModal')" class="text-[#8c7a6b] hover:text-[#47392b]"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="taskForm" onsubmit="handleTaskSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                <div>
                    <label class="block text-xs font-semibold text-[#5c4a38] mb-1">Titel</label>
                    <input type="text" id="taskTitle" required class="w-full px-3 py-2 text-xs bg-[#fbf9f5] border border-[#eae4d9] rounded-xl focus:outline-none focus:border-[#8c7a6b]" placeholder="Wat moet er gebeuren?">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-[#5c4a38] mb-1">Datum</label>
                        <input type="date" id="taskDate" required class="w-full px-3 py-2 text-xs bg-[#fbf9f5] border border-[#eae4d9] rounded-xl focus:outline-none focus:border-[#8c7a6b]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#5c4a38] mb-1">Tijd (Optioneel)</label>
                        <input type="time" id="taskTime" class="w-full px-3 py-2 text-xs bg-[#fbf9f5] border border-[#eae4d9] rounded-xl focus:outline-none focus:border-[#8c7a6b]">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#5c4a38] mb-1">Categorie / Label</label>
                    <select id="taskCategory" class="w-full px-3 py-2 text-xs bg-[#fbf9f5] border border-[#eae4d9] rounded-xl focus:outline-none focus:border-[#8c7a6b]">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#5c4a38] mb-1">Beschrijving / Notitie</label>
                    <textarea id="taskDesc" rows="3" class="w-full px-3 py-2 text-xs bg-[#fbf9f5] border border-[#eae4d9] rounded-xl focus:outline-none focus:border-[#8c7a6b]" placeholder="Extra details..."></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('taskModal')" class="px-4 py-2 text-xs font-medium text-[#78614e] bg-[#f5f2eb] hover:bg-[#eae4d9] rounded-xl transition">Annuleren</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-[#78614e] hover:bg-[#5c4a38] rounded-xl transition">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Habit Modal -->
    <div id="habitModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-[#eae4d9] overflow-hidden">
            <div class="px-6 py-4 border-b border-[#eae4d9] flex justify-between items-center bg-[#fbf9f5]">
                <h3 class="text-sm font-bold text-[#47392b]">Nieuwe Gewoonte</h3>
                <button onclick="closeModal('habitModal')" class="text-[#8c7a6b] hover:text-[#47392b]"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleHabitSubmit(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-[#5c4a38] mb-1">Naam gewoontes</label>
                    <input type="text" id="habitNameInput" required class="w-full px-3 py-2 text-xs bg-[#fbf9f5] border border-[#eae4d9] rounded-xl focus:outline-none focus:border-[#8c7a6b]" placeholder="Bijv. 2L water drinken">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('habitModal')" class="px-4 py-2 text-xs font-medium text-[#78614e] bg-[#f5f2eb] hover:bg-[#eae4d9] rounded-xl transition">Annuleren</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-[#78614e] hover:bg-[#5c4a38] rounded-xl transition">Toevoegen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Birthday Modal -->
    <div id="birthdayModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-[#eae4d9] overflow-hidden">
            <div class="px-6 py-4 border-b border-[#eae4d9] flex justify-between items-center bg-[#fbf9f5]">
                <h3 class="text-sm font-bold text-[#47392b]">Verjaardag Toevoegen</h3>
                <button onclick="closeModal('birthdayModal')" class="text-[#8c7a6b] hover:text-[#47392b]"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleBirthdaySubmit(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-[#5c4a38] mb-1">Naam</label>
                    <input type="text" id="bdayName" required class="w-full px-3 py-2 text-xs bg-[#fbf9f5] border border-[#eae4d9] rounded-xl focus:outline-none focus:border-[#8c7a6b]" placeholder="Naam jarige">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#5c4a38] mb-1">Datum</label>
                    <input type="date" id="bdayDate" required class="w-full px-3 py-2 text-xs bg-[#fbf9f5] border border-[#eae4d9] rounded-xl focus:outline-none focus:border-[#8c7a6b]">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('birthdayModal')" class="px-4 py-2 text-xs font-medium text-[#78614e] bg-[#f5f2eb] hover:bg-[#eae4d9] rounded-xl transition">Annuleren</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-[#78614e] hover:bg-[#5c4a38] rounded-xl transition">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl border border-[#eae4d9] overflow-hidden">
            <div class="px-6 py-4 border-b border-[#eae4d9] flex justify-between items-center bg-[#fbf9f5]">
                <h3 class="text-sm font-bold text-[#47392b]">Instellingen & Categorieën</h3>
                <button onclick="closeModal('settingsModal')" class="text-[#8c7a6b] hover:text-[#47392b]"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 space-y-6">
                <div>
                    <h4 class="text-xs font-bold text-[#47392b] mb-3">Categorieën Beheren</h4>
                    <div id="categoriesList" class="space-y-2 mb-3">
                        <!-- Categories list -->
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="newCatName" placeholder="Nieuwe categorie..." class="flex-1 px-3 py-2 text-xs bg-[#fbf9f5] border border-[#eae4d9] rounded-xl focus:outline-none focus:border-[#8c7a6b]">
                        <input type="color" id="newCatColor" value="#8c7a6b" class="w-10 h-9 rounded-xl border border-[#eae4d9] bg-transparent cursor-pointer">
                        <button onclick="addNewCategory()" class="px-4 py-2 text-xs font-semibold text-white bg-[#78614e] hover:bg-[#5c4a38] rounded-xl transition">Toevoegen</button>
                    </div>
                </div>

                <div class="border-t border-[#eae4d9] pt-4">
                    <h4 class="text-xs font-bold text-[#47392b] mb-2">Gegevens</h4>
                    <div class="flex gap-2">
                        <button onclick="exportData()" class="px-3 py-2 text-xs font-medium text-[#78614e] bg-[#f5f2eb] hover:bg-[#eae4d9] rounded-xl transition flex items-center gap-2">
                            <i class="fa-solid fa-download"></i> Exporteer JSON
                        </button>
                        <label class="px-3 py-2 text-xs font-medium text-[#78614e] bg-[#f5f2eb] hover:bg-[#eae4d9] rounded-xl transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-upload"></i> Importeer JSON
                            <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Default Settings with aesthetic beige theme active preset
        const DEFAULT_SETTINGS = {
            theme: 'beige',
            categories: [
                { id: 'work', name: 'Werk', color: '#8c7a6b' },
                { id: 'personal', name: 'Privé', color: '#bcae99' },
                { id: 'health', name: 'Gezondheid', color: '#78614e' },
                { id: 'finance', name: 'Financiën', color: '#5c4a38' }
            ],
            habits: [
                { id: 'h1', name: 'Water drinken (2L)' },
                { id: 'h2', name: 'Wandelen (30 min)' },
                { id: 'h3', name: 'Lezen' }
            ],
            birthdays: [
                { id: 'b1', name: 'Mama', date: '1995-05-14' },
                { id: 'b2', name: 'Jan', date: '1990-11-22' }
            ],
            quickChecklist: [
                { id: 'q1', text: 'Boodschappen doen', done: false },
                { id: 'q2', text: 'Mail beantwoorden', done: true }
            ]
        };

        let appData = {
            currentDate: new Date(),
            tasks: [],
            habits: [],
            habitLogs: {}, // { 'habitId_YYYY-MM-DD': true }
            birthdays: [],
            quickChecklist: [],
            categories: [],
            notepad: ''
        };

        // Firebase Configuration placeholders (Safe fallback to localStorage)
        let db = null;
        let auth = null;
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalData();
            initApp();
        });

        function loadLocalData() {
            const saved = localStorage.getItem('olgenda_beige_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData.tasks = parsed.tasks || [];
                    appData.habits = parsed.habits || DEFAULT_SETTINGS.habits;
                    appData.habitLogs = parsed.habitLogs || {};
                    appData.birthdays = parsed.birthdays || DEFAULT_SETTINGS.birthdays;
                    appData.quickChecklist = parsed.quickChecklist || DEFAULT_SETTINGS.quickChecklist;
                    appData.categories = parsed.categories || DEFAULT_SETTINGS.categories;
                    appData.notepad = parsed.notepad || '';
                } catch(e) {
                    initDefaults();
                }
            } else {
                initDefaults();
            }
        }

        function initDefaults() {
            appData.habits = DEFAULT_SETTINGS.habits;
            appData.birthdays = DEFAULT_SETTINGS.birthdays;
            appData.quickChecklist = DEFAULT_SETTINGS.quickChecklist;
            appData.categories = DEFAULT_SETTINGS.categories;
            saveLocalData();
        }

        function saveLocalData() {
            localStorage.setItem('olgenda_beige_data', JSON.stringify({
                tasks: appData.tasks,
                habits: appData.habits,
                habitLogs: appData.habitLogs,
                birthdays: appData.birthdays,
                quickChecklist: appData.quickChecklist,
                categories: appData.categories,
                notepad: appData.notepad
            }));
        }

        function initApp() {
            renderWeekView();
            renderMiniCalendar();
            renderHabits();
            renderChecklist();
            renderBirthdays();
            renderCategoryOptions();
            renderCategoriesManager();
            document.getElementById('notepadArea').value = appData.notepad;
        }

        // Week Calculation helper
        function getMonday(d) {
            d = new Date(d);
            let day = d.getDay(),
                diff = d.getDate() - day + (day == 0 ? -6: 1); // adjust when day is sunday
            return new Date(d.setDate(diff));
        }

        function changeWeek(direction) {
            let monday = getMonday(appData.currentDate);
            monday.setDate(monday.getDate() + (direction * 7));
            appData.currentDate = monday;
            renderWeekView();
        }

        function goToCurrentWeek() {
            appData.currentDate = new Date();
            renderWeekView();
        }

        function formatDateKey(date) {
            let year = date.getFullYear();
            let month = String(date.getMonth() + 1).padStart(2, '0');
            let day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function renderWeekView() {
            let monday = getMonday(appData.currentDate);
            let weekDays = [];
            for (let i = 0; i < 7; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDays.push(d);
            }

            // Header date text
            let startStr = weekDays[0].toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
            let endStr = weekDays[6].toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
            document.getElementById('currentWeekRange').innerText = `${startStr} - ${endStr}`;

            let grid = document.getElementById('weekGrid');
            grid.innerHTML = '';

            const dayNames = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];

            weekDays.forEach((day, index) => {
                let dateKey = formatDateKey(day);
                let isToday = formatDateKey(new Date()) === dateKey;

                let col = document.createElement('div');
                col.className = `flex flex-col bg-white rounded-2xl border ${isToday ? 'border-[#8c7a6b] ring-1 ring-[#8c7a6b]' : 'border-[#eae4d9]'} shadow-sm overflow-hidden h-[620px]`;
                
                // Column Header
                let headerHtml = `
                    <div class="p-3 bg-[#fbf9f5] border-b border-[#eae4d9] flex justify-between items-center">
                        <div>
                            <span class="text-xs font-bold text-[#47392b]">${dayNames[index]}</span>
                            <div class="text-[10px] text-[#8c7a6b]">${day.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' })}</div>
                        </div>
                        <button onclick="openTaskModalForDate('${dateKey}')" class="w-6 h-6 rounded-lg bg-white border border-[#eae4d9] hover:bg-[#f5f2eb] text-[#78614e] flex items-center justify-center text-xs transition">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                        </button>
                    </div>
                `;

                // Tasks container for drag and drop
                let tasksContainerHtml = `<div id="sortable_${dateKey}" data-date="${dateKey}" class="flex-1 p-2.5 overflow-y-auto space-y-2 custom-scrollbar">`;

                let dayTasks = appData.tasks.filter(t => t.date === dateKey);
                dayTasks.sort((a,b) => (a.time || '').localeCompare(b.time || ''));

                dayTasks.forEach(task => {
                    let cat = appData.categories.find(c => c.id === task.category) || { name: 'Algemeen', color: '#8c7a6b' };
                    tasksContainerHtml += `
                        <div data-id="${task.id}" class="task-card bg-[#fbf9f5] border border-[#eae4d9] rounded-xl p-2.5 shadow-sm text-xs relative group cursor-pointer" onclick="editTask('${task.id}')">
                            <div class="flex items-start justify-between gap-1 mb-1">
                                <span class="font-semibold text-[#47392b] line-clamp-2">${escapeHtml(task.title)}</span>
                                <span class="w-2 h-2 rounded-full flex-shrink-0" style="background-color: ${cat.color};" title="${cat.name}"></span>
                            </div>
                            ${task.time ? `<div class="text-[10px] text-[#8c7a6b] flex items-center gap-1 mb-1"><i class="fa-regular fa-clock"></i> ${task.time}</div>` : ''}
                            ${task.desc ? `<p class="text-[10px] text-[#78614e] line-clamp-2">${escapeHtml(task.desc)}</p>` : ''}
                            <div class="absolute right-2 bottom-2 opacity-0 group-hover:opacity-100 transition flex items-center gap-1 bg-white/90 px-1.5 py-0.5 rounded-lg border border-[#eae4d9]">
                                <button onclick="event.stopPropagation(); deleteTask('${task.id}')" class="text-rose-500 hover:text-rose-700 text-[10px]"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });

                tasksContainerHtml += `</div>`;

                col.innerHTML = headerHtml + tasksContainerHtml;
                grid.appendChild(col);

                // Initialize SortableJS
                setTimeout(() => {
                    let el = document.getElementById(`sortable_${dateKey}`);
                    if (el) {
                        Sortable.create(el, {
                            group: 'shared-tasks',
                            animation: 150,
                            onEnd: function (evt) {
                                let taskId = evt.item.getAttribute('data-id');
                                let newDate = evt.to.getAttribute('data-date');
                                updateTaskDate(taskId, newDate);
                            }
                        });
                    }
                }, 0);
            });
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            if (id === 'taskModal') {
                document.getElementById('taskForm').reset();
                document.getElementById('taskId').value = '';
                document.getElementById('taskModalTitle').innerText = 'Nieuwe Taak Toevoegen';
                document.getElementById('taskDate').value = formatDateKey(new Date());
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function openTaskModalForDate(dateKey) {
            openModal('taskModal');
            document.getElementById('taskDate').value = dateKey;
        }

        function renderCategoryOptions() {
            let select = document.getElementById('taskCategory');
            select.innerHTML = '';
            appData.categories.forEach(cat => {
                let opt = document.createElement('option');
                opt.value = cat.id;
                opt.innerText = cat.name;
                select.appendChild(opt);
            });
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            let id = document.getElementById('taskId').value;
            let title = document.getElementById('taskTitle').value;
            let date = document.getElementById('taskDate').value;
            let time = document.getElementById('taskTime').value;
            let category = document.getElementById('taskCategory').value;
            let desc = document.getElementById('taskDesc').value;

            if (id) {
                let task = appData.tasks.find(t => t.id === id);
                if (task) {
                    task.title = title;
                    task.date = date;
                    task.time = time;
                    task.category = category;
                    task.desc = desc;
                }
            } else {
                let newTask = {
                    id: 'task_' + Date.now(),
                    title, date, time, category, desc
                };
                appData.tasks.push(newTask);
            }

            saveLocalData();
            closeModal('taskModal');
            renderWeekView();
        }

        function editTask(id) {
            let task = appData.tasks.find(t => t.id === id);
            if (!task) return;
            openModal('taskModal');
            document.getElementById('taskId').value = task.id;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDate').value = task.date;
            document.getElementById('taskTime').value = task.time || '';
            document.getElementById('taskCategory').value = task.category;
            document.getElementById('taskDesc').value = task.desc || '';
            document.getElementById('taskModalTitle').innerText = 'Taak Bewerken';
        }

        function deleteTask(id) {
            appData.tasks = appData.tasks.filter(t => t.id !== id);
            saveLocalData();
            renderWeekView();
        }

        function updateTaskDate(taskId, newDate) {
            let task = appData.tasks.find(t => t.id === taskId);
            if (task) {
                task.date = newDate;
                saveLocalData();
                renderWeekView();
            }
        }

        let miniCalDate = new Date();

        function renderMiniCalendar() {
            let year = miniCalDate.getFullYear();
            let month = miniCalDate.getMonth();

            const monthNames = ['Januari', 'Februari', 'Maart', 'April', 'Mei', 'Juni', 'Juli', 'Augustus', 'September', 'Oktober', 'November', 'December'];
            document.getElementById('miniCalMonth').innerText = `${monthNames[month]} ${year}`;

            let grid = document.getElementById('miniCalendarGrid');
            grid.innerHTML = '';

            ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'].forEach(d => {
                grid.innerHTML += `<span class="font-bold text-[#8c7a6b] text-[10px]">${d}</span>`;
            });

            let firstDay = new Date(year, month, 1);
            let lastDay = new Date(year, month + 1, 0);
            
            let startDayIndex = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
            let totalDays = lastDay.getDate();

            for (let i = 0; i < startDayIndex; i++) {
                grid.innerHTML += `<span></span>`;
            }

            for (let d = 1; d <= totalDays; d++) {
                let thisDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                let isToday = formatDateKey(new Date()) === thisDateStr;
                grid.innerHTML += `<button onclick="jumpToDate('${thisDateStr}')" class="p-1 rounded-lg text-[10px] ${isToday ? 'bg-[#78614e] text-white font-bold' : 'hover:bg-[#eae4d9] text-[#47392b]'} transition">${d}</button>`;
            }
        }

        function changeMiniMonth(dir) {
            miniCalDate.setMonth(miniCalDate.getMonth() + dir);
            renderMiniCalendar();
        }

        function jumpToDate(dateStr) {
            appData.currentDate = new Date(dateStr);
            renderWeekView();
        }

        function renderHabits() {
            let container = document.getElementById('habitsList');
            container.innerHTML = '';
            let todayKey = formatDateKey(new Date());

            appData.habits.forEach(habit => {
                let logKey = `${habit.id}_${todayKey}`;
                let isDone = !!appData.habitLogs[logKey];

                container.innerHTML += `
                    <div class="flex items-center justify-between bg-white p-2 rounded-xl border border-[#eae4d9]">
                        <span class="text-xs text-[#47392b] font-medium">${escapeHtml(habit.name)}</span>
                        <button onclick="toggleHabit('${habit.id}')" class="w-6 h-6 rounded-lg border ${isDone ? 'bg-[#78614e] border-[#78614e] text-white' : 'border-[#d9cebc] hover:bg-[#f5f2eb]'} flex items-center justify-center transition">
                            ${isDone ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                        </button>
                    </div>
                `;
            });
        }

        function toggleHabit(habitId) {
            let todayKey = formatDateKey(new Date());
            let logKey = `${habitId}_${todayKey}`;
            appData.habitLogs[logKey] = !appData.habitLogs[logKey];
            if (appData.habitLogs[logKey]) {
                confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
            }
            saveLocalData();
            renderHabits();
        }

        function handleHabitSubmit(e) {
            e.preventDefault();
            let name = document.getElementById('habitNameInput').value;
            appData.habits.push({ id: 'habit_' + Date.now(), name });
            saveLocalData();
            closeModal('habitModal');
            renderHabits();
            document.getElementById('habitNameInput').value = '';
        }

        function renderChecklist() {
            let container = document.getElementById('quickChecklistContainer');
            container.innerHTML = '';

            appData.quickChecklist.forEach(item => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-white p-1.5 px-2.5 rounded-xl border border-[#eae4d9]">
                        <label class="flex items-center space-x-2 text-xs text-[#47392b] cursor-pointer">
                            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleChecklistItem('${item.id}')" class="rounded border-[#d9cebc] text-[#78614e] focus:ring-0">
                            <span class="${item.done ? 'line-through text-[#bcae99]' : ''}">${escapeHtml(item.text)}</span>
                        </label>
                        <button onclick="deleteChecklistItem('${item.id}')" class="text-[#bcae99] hover:text-rose-500 text-[10px]"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function addQuickChecklist() {
            let text = prompt('Nieuw taakje:');
            if (text) {
                appData.quickChecklist.push({ id: 'q_' + Date.now(), text, done: false });
                saveLocalData();
                renderChecklist();
            }
        }

        function toggleChecklistItem(id) {
            let item = appData.quickChecklist.find(i => i.id === id);
            if (item) {
                item.done = !item.done;
                saveLocalData();
                renderChecklist();
            }
        }

        function deleteChecklistItem(id) {
            appData.quickChecklist = appData.quickChecklist.filter(i => i.id !== id);
            saveLocalData();
            renderChecklist();
        }

        function renderBirthdays() {
            let container = document.getElementById('birthdaysList');
            container.innerHTML = '';

            appData.birthdays.forEach(b => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-2 rounded-xl border border-[#eae4d9]">
                        <span class="font-medium text-[#47392b]">${escapeHtml(b.name)}</span>
                        <span class="text-[#8c7a6b]">${b.date}</span>
                    </div>
                `;
            });
        }

        function handleBirthdaySubmit(e) {
            e.preventDefault();
            let name = document.getElementById('bdayName').value;
            let date = document.getElementById('bdayDate').value;
            appData.birthdays.push({ id: 'bday_' + Date.now(), name, date });
            saveLocalData();
            closeModal('birthdayModal');
            renderBirthdays();
        }

        function renderCategoriesManager() {
            let container = document.getElementById('categoriesList');
            container.innerHTML = '';

            appData.categories.forEach(cat => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-[#fbf9f5] p-2 rounded-xl border border-[#eae4d9]">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full" style="background-color: ${cat.color};"></span>
                            <span class="text-xs font-medium text-[#47392b]">${escapeHtml(cat.name)}</span>
                        </div>
                        <button onclick="deleteCategory('${cat.id}')" class="text-rose-500 hover:text-rose-700 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function addNewCategory() {
            let name = document.getElementById('newCatName').value;
            let color = document.getElementById('newCatColor').value;
            if (name) {
                appData.categories.push({ id: 'cat_' + Date.now(), name, color });
                saveLocalData();
                document.getElementById('newCatName').value = '';
                renderCategoriesManager();
                renderCategoryOptions();
            }
        }

        function deleteCategory(id) {
            appData.categories = appData.categories.filter(c => c.id !== id);
            saveLocalData();
            renderCategoriesManager();
            renderCategoryOptions();
        }

        function saveNotepad() {
            appData.notepad = document.getElementById('notepadArea').value;
            saveLocalData();
        }

        function toggleWidgetPanel() {
            let sidebar = document.getElementById('widgetSidebar');
            sidebar.classList.toggle('hidden');
        }

        function exportData() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            let dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "olgenda_beige_backup.json");
            dlAnchorElem.click();
        }

        function importData(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(event) {
                try {
                    let parsed = JSON.parse(event.target.result);
                    appData = parsed;
                    saveLocalData();
                    initApp();
                    alert('Gegevens succesvol geïmporteerd!');
                } catch(err) {
                    alert('Fout bij importeren van JSON bestand.');
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Firebase Auth simulation / mock stubs
        function loginWithGoogle() {
            currentUser = { displayName: 'Olga Gebruiker', email: 'olga@example.com', photoURL: 'https://placehold.co/32x32/d9cebc/47392b?text=O' };
            document.getElementById('loginBtn').classList.add('hidden');
            let profile = document.getElementById('userProfile');
            profile.classList.remove('hidden');
            profile.classList.add('flex');
            document.getElementById('userAvatar').src = currentUser.photoURL;
        }

        function logout() {
            currentUser = null;
            document.getElementById('userProfile').classList.add('hidden');
            document.getElementById('userProfile').classList.remove('flex');
            document.getElementById('loginBtn').classList.remove('hidden');
        }
    </script>
</body>
</html>
