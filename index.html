<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olgenda - Weekplanner & Agenda</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: {
                            50: '#fbf9f5',
                            100: '#f4efe6',
                            200: '#e6ded0',
                            300: '#d1c4b2',
                            400: '#b8a691',
                            500: '#8c7a6b',
                            600: '#78614e',
                            700: '#5c4a38',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(140, 122, 107, 0.08)',
                        'card': '0 2px 12px 0 rgba(0, 0, 0, 0.04)'
                    }
                }
            }
        }
    </script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome voor iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #fbf9f5;
            color: #5c4a38;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .custom-card {
            background: #ffffff;
            border: 1px solid #e6ded0;
            border-radius: 1rem;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full bg-white border-b border-beige-200 py-4 px-6 mb-6 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-2xl font-bold tracking-tight text-beige-700">Olgenda</h1>
                <span class="text-xs bg-beige-100 text-beige-600 px-2.5 py-1 rounded-full font-medium">Digital Life Planner</span>
            </div>
            <div id="user-info" class="flex items-center space-x-4">
                <span id="user-email" class="text-sm text-beige-600 font-medium"></span>
                <button id="logout-btn" class="hidden text-xs bg-beige-100 hover:bg-beige-200 text-beige-700 px-3 py-1.5 rounded-lg transition-colors font-medium">Uitloggen</button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid (Losse containers in plaats van één enkel kader) -->
    <main class="max-w-7xl mx-auto w-full px-4 flex-grow grid grid-cols-1 lg:grid-cols-4 gap-6 pb-12">
        
        <!-- Linkerkant / Weekplanner (3 kolommen breed) -->
        <section class="lg:col-span-3 space-y-6">
            <!-- Week Navigatie & Acties -->
            <div class="custom-card p-4 flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center space-x-2">
                    <button id="prev-week" class="p-2 rounded-lg hover:bg-beige-100 text-beige-600 transition-colors"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="current-week-label" class="font-semibold text-lg text-beige-700">Week --</span>
                    <button id="next-week" class="p-2 rounded-lg hover:bg-beige-100 text-beige-600 transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
                    <button id="today-btn" class="text-xs bg-beige-100 hover:bg-beige-200 text-beige-700 px-3 py-1.5 rounded-lg transition-colors font-medium ml-2">Vandaag</button>
                </div>
                <button id="open-add-modal" class="bg-beige-700 hover:bg-beige-600 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nieuw Item Inplannen</span>
                </button>
            </div>

            <!-- Dagen Raster -->
            <div id="week-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Wordt dynamisch gevuld met dagen (Maandag t/m Zondag) -->
            </div>
        </section>

        <!-- Rechterkolom / Widgets (1 kolom breed) -->
        <aside class="space-y-6">
            <!-- Widgets Beheer & Categorieën -->
            <div class="custom-card p-5">
                <h3 class="font-semibold text-beige-700 mb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-beige-500"></i>
                    <span>Widgets Beheer</span>
                </h3>
                <p class="text-xs text-beige-500 mb-4">Kies welke widgets je wilt tonen in je overzicht.</p>
                <div id="widget-toggles" class="space-y-2 text-sm">
                    <!-- Widgets checkboxes -->
                </div>
            </div>

            <!-- Notitieblok Widget -->
            <div id="widget-notepad" class="custom-card p-5">
                <h3 class="font-semibold text-beige-700 mb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-note-sticky text-beige-500"></i>
                    <span>Notitieblok</span>
                </h3>
                <textarea id="notepad-input" rows="4" class="w-full p-3 text-sm border border-beige-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-beige-400 bg-beige-50 resize-none" placeholder="Schrijf hier je snelle notities..."></textarea>
            </div>

            <!-- Afvinklijst / Boodschappen Widget -->
            <div id="widget-checklist" class="custom-card p-5">
                <h3 class="font-semibold text-beige-700 mb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-beige-500"></i>
                    <span>Afvinklijst</span>
                </h3>
                <div class="flex space-x-2 mb-3">
                    <input type="text" id="checklist-item-input" placeholder="Nieuw item..." class="flex-grow px-3 py-1.5 text-sm border border-beige-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-beige-400 bg-beige-50">
                    <button id="add-checklist-btn" class="bg-beige-600 hover:bg-beige-700 text-white px-3 py-1.5 rounded-lg text-sm transition-colors"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul id="checklist-container" class="space-y-2 text-sm">
                    <!-- Items met ronde bolletjes -->
                </ul>
            </div>
        </aside>
    </main>

    <!-- Tijdselectie voorbeeldspecificatie (tijdstappen van 5 minuten in modals of formulieren) -->
    <!-- Voorbeeld tijdinput attribuut: type="time" step="300" -->

    <footer class="text-center py-6 text-xs text-beige-400 border-t border-beige-200 mt-auto">
        &copy; 2026 Olgenda. Gemaakt met een schone, minimalistische GGC-stijl.
    </footer>

</body>
</html>
