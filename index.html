<script>
        const firebaseConfig = {
            apiKey: "AIzaSyA861FoEtfcy7p4369sJUJ-OZIJiOXEn5A",
            authDomain: "olgenda-9bf5f.firebaseapp.com",
            projectId: "olgenda-9bf5f",
            storageBucket: "olgenda-9bf5f.firebasestorage.app",
            messagingSenderId: "13330878107",
            appId: "1:13330878107:web:bdaf88009733369f17003e",
            measurementId: "G-65R9MKHKRZ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let isRegisterMode = false;

        const DAYS_NL = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];
        
        const DEFAULT_CATEGORIES = [
            { id: 'cat_work', name: 'Werk / Studie', color: '#3b82f6' },
            { id: 'cat_personal', name: 'Persoonlijk', color: '#10b981' },
            { id: 'cat_sport', name: 'Sport & Gezondheid', color: '#f97316' },
            { id: 'cat_important', name: 'Belangrijk', color: '#ef4444' },
            { id: 'cat_social', name: 'Sociaal', color: '#8b5cf6' }
        ];

        const DEFAULT_WIDGETS = [
            { id: 'w_mini_calendar', type: 'miniCalendar', title: 'mini-kalender', enabled: true },
            { id: 'w_habit_tracker', type: 'habits', title: 'habit tracker', enabled: true },
            { id: 'w_checklist', type: 'checklist', title: 'checklist', enabled: true },
            { id: 'w_braindump', type: 'notepad', title: 'braindump', enabled: true }
        ];

        const DEFAULT_SETTINGS = {
            activePreset: 'emmy',
            bgColor: '#f9f5fb',
            cardColor: '#ffffff',
            textColor: '#1a1025',
            accentColor: '#7e22ce',
            headerBg1: '#e8d5fc',
            headerBg2: '#d8b4fe',
            profileBorderColor: '#e8d5fc',
            userName: '',
            avatarImg: 'https://placehold.co/120x120/6366f1/ffffff?text=U',
            avatarShape: 'rounded-full',
            radius: '16px',
            borderStyle: 'solid',
            font: 'font-quicksand',
            categories: DEFAULT_CATEGORIES,
            widgets: DEFAULT_WIDGETS
        };

        const PRESETS = {
            emmy: { bgColor: '#f9f5fb', cardColor: '#ffffff', textColor: '#1a1025', accentColor: '#7e22ce', headerBg1: '#e8d5fc', headerBg2: '#d8b4fe', profileBorderColor: '#e8d5fc', radius: '20px', borderStyle: 'solid' },
            isabel: { bgColor: '#e2f3ea', cardColor: '#ffffff', textColor: '#0a1d17', accentColor: '#0f9f8c', headerBg1: '#59937d', headerBg2: '#a4e8d2', profileBorderColor: '#59937d', radius: '16px', borderStyle: 'solid' },
            floris: { bgColor: '#41698e', cardColor: '#516885', textColor: '#e8eff7', accentColor: '#1d3f94', headerBg1: '#375a7f', headerBg2: '#b8d2ef', profileBorderColor: '#1d3f94', radius: '12px', borderStyle: 'solid' },
            olga: { bgColor: '#fbf5f0', cardColor: '#ffffff', textColor: '#63200b', accentColor: '#f77383', headerBg1: '#f8cde2', headerBg2: '#f58296', profileBorderColor: '#f8cde2', radius: '24px', borderStyle: 'solid' },
            custom: { bgColor: '#f8fafc', cardColor: '#ffffff', textColor: '#0f172a', accentColor: '#6366f1', headerBg1: '#4f46e5', headerBg2: '#7c3aed', profileBorderColor: '#ffffff', radius: '16px', borderStyle: 'solid' }
        };

        let state = {
            currentWeekOffset: 0,
            selectedCategoryFilter: 'all',
            items: [],
            widgetData: {}, 
            settings: { ...DEFAULT_SETTINGS }
        };

        window.handleAuthSubmit = async function(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errorBox = document.getElementById('auth-error');
            const submitBtn = document.getElementById('auth-submit-btn');

            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            const origText = submitBtn.textContent;
            submitBtn.textContent = 'Bezig met verwerken...';

            try {
                if (isRegisterMode) {
                    await auth.createUserWithEmailAndPassword(email, password);
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (error) {
                console.error("Inlogfout:", error);
                let msg = error.message;
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    msg = "Ongeldig e-mailadres of wachtwoord.";
                } else if (error.code === 'auth/email-already-in-use') {
                    msg = "Dit e-mailadres is al in gebruik.";
                } else if (error.code === 'auth/weak-password') {
                    msg = "Wachtwoord moet minimaal 6 tekens bevatten.";
                }
                errorBox.textContent = msg;
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isRegisterMode ? 'Account registreren' : 'Inloggen';
            }
        };

        window.forgotPassword = function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('auth-email');
            let email = emailInput.value.trim();
            if (!email) email = prompt("Vul je e-mailadres in:");
            if (email) {
                auth.sendPasswordResetEmail(email)
                    .then(() => alert("Herstellink verzonden naar je e-mailadres."))
                    .catch((err) => alert("Fout bij verzenden: " + err.message));
            }
        };

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').textContent = isRegisterMode ? 'Account aanmaken' : 'Inloggen bij Olgenda';
            document.getElementById('auth-submit-btn').textContent = isRegisterMode ? 'Account registreren' : 'Inloggen';
            document.getElementById('auth-switch-text').textContent = isRegisterMode ? 'Al een account?' : 'Nog geen account?';
            document.getElementById('auth-switch-btn').textContent = isRegisterMode ? 'Log in' : 'Maak er een aan';
            document.getElementById('auth-error').classList.add('hidden');
        };

        window.logoutUser = function() { auth.signOut(); };

        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            const authScreen = document.getElementById('auth-screen');
            const appScreen = document.getElementById('app-screen');

            if (user) {
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                try {
                    await loadStateForUser(user.uid);
                    applySettingsUI();
                    renderCategoryManager();
                    renderRightWidgets();
                    renderPlanner();
                } catch (err) {
                    console.error("Fout tijdens opbouwen van het scherm:", err);
                }
            } else {
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        async function loadStateForUser(uid) {
            try {
                const settingsDoc = await db.collection('olgenda_users').doc(uid).collection('data').doc('settings').get();
                if (settingsDoc.exists) state.settings = { ...DEFAULT_SETTINGS, ...settingsDoc.data() };

                const widgetDataDoc = await db.collection('olgenda_users').doc(uid).collection('data').doc('widgetData').get();
                if (widgetDataDoc.exists) {
                    state.widgetData = widgetDataDoc.data() || {};
                }

                const itemsSnapshot = await db.collection('olgenda_users').doc(uid).collection('items').get();
                state.items = [];
                itemsSnapshot.forEach(doc => state.items.push({ id: doc.id, ...doc.data() }));
                if (!state.settings.categories) state.settings.categories = [...DEFAULT_CATEGORIES];
                if (!state.settings.widgets) state.settings.widgets = [...DEFAULT_WIDGETS];
            } catch (e) { 
                console.error("Fout bij laden Firebase data:", e); 
            }
        }

        async function saveSettingsToFirebase() {
            if (!currentUser) return;
            await db.collection('olgenda_users').doc(currentUser.uid).collection('data').doc('settings').set(state.settings);
        }

        async function saveWidgetDataToFirebase() {
            if (!currentUser) return;
            await db.collection('olgenda_users').doc(currentUser.uid).collection('data').doc('widgetData').set(state.widgetData);
        }

        async function saveItemToFirebase(item) {
            if (!currentUser) return;
            await db.collection('olgenda_users').doc(currentUser.uid).collection('items').doc(item.id).set(item);
        }

        async function deleteItemFromFirebase(itemId) {
            if (!currentUser) return;
            await db.collection('olgenda_users').doc(currentUser.uid).collection('items').doc(itemId).delete();
        }

        function getStartOfWeek(offset = 0) {
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(now.setDate(diff));
            monday.setDate(monday.getDate() + (offset * 7));
            monday.setHours(0,0,0,0);
            return monday;
        }

        function formatWeekLabel(startDate) {
            const endDate = new Date(startDate);
            endDate.setDate(endDate.getDate() + 6);
            return `${startDate.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' })} - ${endDate.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' })}`;
        }

        function getWeekKey(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            return `${d.getFullYear()}-W${Math.ceil((((d - yearStart) / 86400000) + 1) / 7)}`;
        }

        function getTodayIndexInWeek() {
            const day = new Date().getDay();
            return day === 0 ? 6 : day - 1;
        }

        function updateLogoTheme() {
            const logoImg = document.getElementById('olgenda-logo-img');
            const headerEl = document.getElementById('planner-header');
            if (!logoImg || !headerEl) return;
            const computedBg = window.getComputedStyle(headerEl).backgroundImage || window.getComputedStyle(headerEl).backgroundColor;
            const rgbMatch = computedBg.match(/\d+/g);
            let isDark = rgbMatch && rgbMatch.length >= 3 && ((parseInt(rgbMatch[0]) * 299 + parseInt(rgbMatch[1]) * 587 + parseInt(rgbMatch[2]) * 114) / 1000 < 128);
            logoImg.src = isDark ? 'Olgenda-donker-thema.png' : 'Olgenda-licht-thema.png';
        }

        function getDynamicGreeting(name) {
            const hour = new Date().getHours();
            let greeting = hour < 12 ? 'Goedemorgen' : (hour < 18 ? 'Goedemiddag' : 'Goedenavond');
            const trimmedName = name ? name.trim() : '';
            return trimmedName ? `${greeting} ${trimmedName}!` : `${greeting}!`;
        }

        function renderRightWidgets() {
            const container = document.getElementById('widgets-render-area');
            if (!container) return;
            container.innerHTML = '';

            if (!state.settings.widgets || state.settings.widgets.length === 0) {
                state.settings.widgets = [...DEFAULT_WIDGETS];
            }

            state.settings.widgets.forEach(w => {
                if (!w.enabled) return;

                if (w.type === 'notepad') {
                    const card = document.createElement('div');
                    card.className = 'custom-card p-4 md:p-5 flex flex-col space-y-4 shadow-md';
                    const content = state.widgetData[w.id] || '';
                    card.innerHTML = `
                        <div class="flex items-center justify-between border-b pb-3 border-gray-200/60">
                            <h3 class="font-bold text-base flex items-center gap-2 capitalize" style="color: var(--accent-color);">
                                <i class="fa-solid fa-brain" style="color: var(--accent-color);"></i>
                                <span>${escapeHtml(w.title)}</span>
                            </h3>
                        </div>
                        <div class="flex-1 flex flex-col space-y-2">
                            <textarea id="np_${w.id}" rows="5" placeholder="Gedachten, losse ideetjes..." class="w-full p-3 text-xs bg-amber-50/30 border border-amber-200/60 rounded-xl focus:ring-2 focus:bg-white outline-none resize-y transition leading-relaxed shadow-inner" style="--tw-ring-color: var(--accent-color);">${escapeHtml(content)}</textarea>
                            <div class="flex items-center justify-between text-[11px] text-gray-400 px-1">
                                <span id="status_${w.id}">Opgeslagen</span>
                                <button type="button" id="clear_${w.id}" class="hover:text-rose-600 transition font-medium">Wis</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);

                    const ta = card.querySelector(`#np_${w.id}`);
                    ta.addEventListener('input', () => {
                        state.widgetData[w.id] = ta.value;
                        card.querySelector(`#status_${w.id}`).innerText = "Opslaan...";
                        clearTimeout(window[`timer_${w.id}`]);
                        window[`timer_${w.id}`] = setTimeout(() => {
                            saveWidgetDataToFirebase();
                            card.querySelector(`#status_${w.id}`).innerText = "Opgeslagen ✓";
                        }, 800);
                    });
                    card.querySelector(`#clear_${w.id}`).addEventListener('click', () => {
                        if (confirm("Weet je zeker dat je je braindump wilt legen?")) {
                            ta.value = ''; state.widgetData[w.id] = ''; saveWidgetDataToFirebase();
                        }
                    });
                }
                else if (w.type === 'habits') {
                    const card = document.createElement('div');
                    card.className = 'custom-card p-4 md:p-5 flex flex-col space-y-4 shadow-md';
                    const habitList = state.widgetData[w.id] || [
                        { text: 'Water drinken (2L)', days: [false,false,false,false,false,false,false] },
                        { text: 'Wandelen', days: [false,false,false,false,false,false,false] }
                    ];

                    let habitsHtml = `
                        <div class="flex items-center justify-between border-b pb-3 border-gray-200/60">
                            <h3 class="font-bold text-base flex items-center gap-2 capitalize" style="color: var(--accent-color);">
                                <i class="fa-solid fa-square-check" style="color: var(--accent-color);"></i>
                                <span>${escapeHtml(w.title)}</span>
                            </h3>
                        </div>
                        <div class="space-y-3">
                    `;

                    habitList.forEach((h, hIdx) => {
                        habitsHtml += `
                            <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200/60 space-y-2">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-xs text-gray-700">${escapeHtml(h.text)}</span>
                                    <button class="del-habit text-gray-400 hover:text-rose-600 text-xs" data-wid="${w.id}" data-hidx="${hIdx}"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                                <div class="grid grid-cols-7 gap-1 text-center">
                        `;
                        ['M','D','W','D','V','Z','Z'].forEach((dLabel, dIdx) => {
                            const checked = h.days[dIdx] ? 'bg-purple-600 text-white font-bold border-purple-600' : 'bg-white text-gray-500 border-gray-300';
                            habitsHtml += `<button type="button" class="habit-day-btn py-1 rounded-lg text-[10px] border transition ${checked}" data-wid="${w.id}" data-hidx="${hIdx}" data-didx="${dIdx}">${dLabel}</button>`;
                        });
                        habitsHtml += `</div></div>`;
                    });

                    habitsHtml += `
                        <div class="flex items-center gap-2 pt-1">
                            <input type="text" id="new_habit_${w.id}" placeholder="Nieuwe gewoonte..." class="flex-1 p-2 rounded-xl border border-gray-300 text-xs bg-white">
                            <button type="button" class="add-habit-btn px-3 py-2 text-white font-bold rounded-xl text-xs transition custom-btn-primary" data-wid="${w.id}"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>`;
                    card.innerHTML = habitsHtml;
                    container.appendChild(card);

                    card.querySelectorAll('.habit-day-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const wid = e.currentTarget.dataset.wid;
                            const hIdx = parseInt(e.currentTarget.dataset.hidx);
                            const dIdx = parseInt(e.currentTarget.dataset.didx);
                            if (!state.widgetData[wid]) state.widgetData[wid] = habitList;
                            state.widgetData[wid][hIdx].days[dIdx] = !state.widgetData[wid][hIdx].days[dIdx];
                            saveWidgetDataToFirebase(); renderRightWidgets();
                        });
                    });

                    card.querySelectorAll('.del-habit').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const wid = e.currentTarget.dataset.wid;
                            const hIdx = parseInt(e.currentTarget.dataset.hidx);
                            state.widgetData[wid].splice(hIdx, 1);
                            saveWidgetDataToFirebase(); renderRightWidgets();
                        });
                    });

                    card.querySelector('.add-habit-btn').addEventListener('click', (e) => {
                        const wid = e.currentTarget.dataset.wid;
                        const input = card.querySelector(`#new_habit_${wid}`);
                        const val = input.value.trim();
                        if (val) {
                            if (!state.widgetData[wid]) state.widgetData[wid] = [...habitList];
                            state.widgetData[wid].push({ text: val, days: [false,false,false,false,false,false,false] });
                            saveWidgetDataToFirebase(); renderRightWidgets();
                        }
                    });
                }
                else if (w.type === 'checklist') {
                    const card = document.createElement('div');
                    card.className = 'custom-card p-4 md:p-5 flex flex-col space-y-3 shadow-md';
                    const checkItems = state.widgetData[w.id] || [
                        { text: 'Boodschappen doen', done: false },
                        { text: 'Planten water geven', done: true }
                    ];

                    let checkHtml = `
                        <div class="flex items-center justify-between border-b pb-3 border-gray-200/60">
                            <h3 class="font-bold text-base flex items-center gap-2 capitalize" style="color: var(--accent-color);">
                                <i class="fa-solid fa-list-check" style="color: var(--accent-color);"></i>
                                <span>${escapeHtml(w.title)}</span>
                            </h3>
                        </div>
                        <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    `;

                    checkItems.forEach((cItem, cIdx) => {
                        checkHtml += `
                            <div class="flex items-center justify-between bg-gray-50 px-2.5 py-2 rounded-xl border border-gray-200/60 text-xs gap-2">
                                <div class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer toggle-chk" data-wid="${w.id}" data-cidx="${cIdx}">
                                    <div class="w-4 h-4 rounded-full border border-gray-400 flex items-center justify-center shrink-0 ${cItem.done ? 'bg-purple-600 border-purple-600 text-white' : 'bg-white'}">
                                        ${cItem.done ? '<i class="fa-solid fa-check text-[9px]"></i>' : ''}
                                    </div>
                                    <span class="truncate ${cItem.done ? 'line-through text-gray-400 font-normal' : 'font-semibold text-gray-700'}">${escapeHtml(cItem.text)}</span>
                                </div>
                                <button class="del-chk text-gray-400 hover:text-rose-600 shrink-0" data-wid="${w.id}" data-cidx="${cIdx}"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                    });

                    checkHtml += `
                        </div>
                        <div class="flex items-center gap-2 pt-1">
                            <input type="text" id="new_chk_${w.id}" placeholder="Nieuw punt..." class="flex-1 p-2 rounded-xl border border-gray-300 text-xs bg-white">
                            <button type="button" class="add-chk-btn px-3 py-2 text-white font-bold rounded-xl text-xs transition custom-btn-primary" data-wid="${w.id}"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    `;
                    card.innerHTML = checkHtml;
                    container.appendChild(card);

                    card.querySelectorAll('.toggle-chk').forEach(el => {
                        el.addEventListener('click', (e) => {
                            const wid = e.currentTarget.dataset.wid;
                            const cIdx = parseInt(e.currentTarget.dataset.cidx);
                            if (!state.widgetData[wid]) state.widgetData[wid] = checkItems;
                            state.widgetData[wid][cIdx].done = !state.widgetData[wid][cIdx].done;
                            if (state.widgetData[wid][cIdx].done && typeof confetti === 'function') confetti({ particleCount: 15, spread: 30 });
                            saveWidgetDataToFirebase(); renderRightWidgets();
                        });
                    });

                    card.querySelectorAll('.del-chk').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const wid = e.currentTarget.dataset.wid;
                            const cIdx = parseInt(e.currentTarget.dataset.cidx);
                            state.widgetData[wid].splice(cIdx, 1);
                            saveWidgetDataToFirebase(); renderRightWidgets();
                        });
                    });

                    card.querySelector('.add-chk-btn').addEventListener('click', (e) => {
                        const wid = e.currentTarget.dataset.wid;
                        const input = card.querySelector(`#new_chk_${wid}`);
                        const val = input.value.trim();
                        if (val) {
                            if (!state.widgetData[wid]) state.widgetData[wid] = [...checkItems];
                            state.widgetData[wid].push({ text: val, done: false });
                            saveWidgetDataToFirebase(); renderRightWidgets();
                        }
                    });
                }
                else if (w.type === 'miniCalendar') {
                    const card = document.createElement('div');
                    card.className = 'custom-card p-4 md:p-5 flex flex-col space-y-3 shadow-md';
                    
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = now.getMonth();
                    const monthNames = ['Januari', 'Februari', 'Maart', 'April', 'Mei', 'Juni', 'Juli', 'Augustus', 'September', 'Oktober', 'November', 'December'];
                    
                    const firstDayIndex = new Date(year, month, 1).getDay();
                    const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    const todayDate = now.getDate();

                    const bdays = state.widgetData[w.id] || {};

                    let calHtml = `
                        <div class="flex items-center justify-between border-b pb-3 border-gray-200/60">
                            <h3 class="font-bold text-base flex items-center gap-2 capitalize" style="color: var(--accent-color);">
                                <i class="fa-solid fa-cake-candles" style="color: var(--accent-color);"></i>
                                <span>${escapeHtml(w.title)} (${monthNames[month]} ${year})</span>
                            </h3>
                        </div>
                        <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-400 pt-1">
                            <span>Ma</span><span>Di</span><span>Wo</span><span>Do</span><span>Vr</span><span>Za</span><span>Zo</span>
                        </div>
                        <div class="grid grid-cols-7 gap-1 text-center text-xs">
                    `;

                    for (let i = 0; i < adjustedFirstDay; i++) {
                        calHtml += `<div></div>`;
                    }

                    for (let d = 1; d <= daysInMonth; d++) {
                        const isToday = d === todayDate;
                        const mStr = String(month + 1).padStart(2, '0');
                        const dStr = String(d).padStart(2, '0');
                        const dateKey = `${mStr}-${dStr}`;
                        const hasBday = bdays[dateKey];

                        calHtml += `
                            <div class="cal-day-cell relative py-1 rounded-lg font-medium cursor-pointer ${isToday ? 'text-white font-bold shadow-sm' : 'hover:bg-gray-100 text-gray-700'} ${hasBday ? 'border border-rose-400 bg-rose-50/50' : ''}" 
                                 style="${isToday ? 'background-color: var(--accent-color);' : ''}" 
                                 data-wid="${w.id}" data-datekey="${dateKey}" data-daynum="${d}" title="${hasBday ? 'Verjaardag: ' + hasBday : 'Klik om verjaardag toe te voegen'}">
                                ${d}
                                ${hasBday ? '<span class="absolute bottom-0.5 right-1 w-1.5 h-1.5 rounded-full bg-rose-500"></span>' : ''}
                            </div>
                        `;
                    }

                    calHtml += `</div>`;

                    const monthBdays = Object.entries(bdays).filter(([k]) => k.startsWith(String(month + 1).padStart(2, '0')));
                    if (monthBdays.length > 0) {
                        calHtml += `<div class="pt-2 border-t border-gray-100 text-[11px] text-gray-500 space-y-1">
                            <span class="font-bold block text-[10px] uppercase text-gray-400">Verjaardagen deze maand:</span>`;
                        monthBdays.forEach(([k, name]) => {
                            const parts = k.split('-');
                            calHtml += `<div class="flex justify-between"><span>${parts[1]} ${monthNames[month].toLowerCase()}: <strong>${escapeHtml(name)}</strong></span></div>`;
                        });
                        calHtml += `</div>`;
                    }

                    card.innerHTML = calHtml;
                    container.appendChild(card);

                    card.querySelectorAll('.cal-day-cell').forEach(cell => {
                        cell.addEventListener('click', (e) => {
                            const wid = e.currentTarget.dataset.wid;
                            const dKey = e.currentTarget.dataset.datekey;
                            const dNum = e.currentTarget.dataset.daynum;
                            const currentVal = bdays[dKey] || '';
                            const newName = prompt(`Wie is er jarig op ${dNum} ${monthNames[month]}? (Laat leeg om te wissen)`, currentVal);
                            
                            if (newName !== null) {
                                if (!state.widgetData[wid]) state.widgetData[wid] = { ...bdays };
                                if (newName.trim() === '') {
                                    delete state.widgetData[wid][dKey];
                                } else {
                                    state.widgetData[wid][dKey] = newName.trim();
                                }
                                saveWidgetDataToFirebase();
                                renderRightWidgets();
                            }
                        });
                    });
                }
            });
        }

        function renderCategoryManager() {
            const listContainer = document.getElementById('category-manager-list');
            const selectContainer = document.getElementById('item-input-category');
            const filterContainer = document.getElementById('category-filter-bar');
            if (!listContainer) return;

            listContainer.innerHTML = '';
            state.settings.categories.forEach((cat, index) => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-200/80';
                item.innerHTML = `
                    <input type="color" value="${cat.color}" class="cat-color-input w-6 h-6 rounded-lg cursor-pointer border border-gray-300 p-0 shrink-0" data-index="${index}">
                    <input type="text" value="${escapeHtml(cat.name)}" class="cat-name-input flex-1 p-1 bg-transparent text-xs font-semibold rounded outline-none" data-index="${index}">
                    <button type="button" class="btn-delete-cat text-gray-400 hover:text-rose-600 p-1" data-index="${index}"><i class="fa-solid fa-xmark text-xs"></i></button>
                `;
                listContainer.appendChild(item);
            });

            listContainer.querySelectorAll('.cat-color-input').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    state.settings.categories[e.target.dataset.index].color = e.target.value;
                    saveSettingsToFirebase(); renderCategoryManager(); renderPlanner();
                });
            });

            listContainer.querySelectorAll('.cat-name-input').forEach(inp => {
                inp.addEventListener('change', (e) => {
                    state.settings.categories[e.target.dataset.index].name = e.target.value.trim() || 'Categorie';
                    saveSettingsToFirebase(); renderCategoryManager(); renderPlanner();
                });
            });

            listContainer.querySelectorAll('.btn-delete-cat').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.settings.categories.splice(e.currentTarget.dataset.index, 1);
                    saveSettingsToFirebase(); renderCategoryManager(); renderPlanner();
                });
            });

            selectContainer.innerHTML = `<option value="">Geen categorie</option>`;
            state.settings.categories.forEach(cat => {
                selectContainer.innerHTML += `<option value="${cat.id}">${escapeHtml(cat.name)}</option>`;
            });

            const isAllSelected = state.selectedCategoryFilter === 'all';
            filterContainer.innerHTML = `<button class="cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${isAllSelected ? 'text-white bg-black/30' : 'bg-white/20 hover:bg-white/30 text-white'}" data-cat-id="all">Alle</button>`;
            
            state.settings.categories.forEach(cat => {
                const isSelected = state.selectedCategoryFilter === cat.id;
                filterContainer.innerHTML += `<button class="cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${isSelected ? 'text-white bg-black/30' : 'bg-white/20 hover:bg-white/30 text-white'}" data-cat-id="${cat.id}"><span class="w-2 h-2 rounded-full" style="background-color: ${cat.color}"></span>${escapeHtml(cat.name)}</button>`;
            });

            filterContainer.querySelectorAll('.cat-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => { state.selectedCategoryFilter = btn.dataset.catId; renderCategoryManager(); renderPlanner(); });
            });
        }

        function applySettingsUI() {
            const s = state.settings;
            const root = document.documentElement;
            root.style.setProperty('--bg-main', s.bgColor);
            root.style.setProperty('--card-bg', s.cardColor);
            root.style.setProperty('--text-main', s.textColor);
            root.style.setProperty('--accent-color', s.accentColor);
            root.style.setProperty('--header-bg', `linear-gradient(135deg, ${s.headerBg1} 0%, ${s.headerBg2} 100%)`);
            root.style.setProperty('--radius-val', s.radius);
            root.style.setProperty('--profile-border-color', s.profileBorderColor || '#ffffff');

            const avatarImg = document.getElementById('header-avatar-img');
            if (avatarImg) avatarImg.src = s.avatarImg;
            
            const greetingHeading = document.getElementById('main-greeting-heading');
            if (greetingHeading) greetingHeading.innerText = getDynamicGreeting(s.userName);
            
            const nameInp = document.getElementById('setting-user-name');
            if (nameInp) nameInp.value = s.userName || '';

            document.getElementById('color-bg').value = s.bgColor;
            document.getElementById('color-card').value = s.cardColor;
            document.getElementById('color-text').value = s.textColor;
            document.getElementById('color-accent').value = s.accentColor;

            const customContainer = document.getElementById('custom-settings-container');
            if (s.activePreset === 'custom') {
                customContainer.classList.remove('hidden');
            } else {
                customContainer.classList.add('hidden');
            }

            updateLogoTheme();
        }

        function renderPlanner() {
            const container = document.getElementById('planner-grid-container');
            if (!container) return;
            container.innerHTML = '';

            const startOfWeek = getStartOfWeek(state.currentWeekOffset);
            const weekKey = getWeekKey(startOfWeek);
            const todayIndex = getTodayIndexInWeek();
            const isCurrentRealWeek = state.currentWeekOffset === 0;

            document.getElementById('current-week-label').innerText = formatWeekLabel(startOfWeek);

            let dayIndices = [0, 1, 2, 3, 4, 5, 6];
            if (isCurrentRealWeek) {
                dayIndices = [];
                for (let i = 0; i < 7; i++) {
                    dayIndices.push((todayIndex + i) % 7);
                }
            }

            let totalItems = 0;
            dayIndices.forEach((i, idx) => {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(dayDate.getDate() + i);

                const isRealToday = isCurrentRealWeek && idx === 0;

                let dayItems = state.items.filter(t => t.weekKey === weekKey && t.dayIndex === i);
                if (state.selectedCategoryFilter !== 'all') dayItems = dayItems.filter(t => t.categoryId === state.selectedCategoryFilter);
                totalItems += dayItems.length;

                const dayCard = document.createElement('div');
                dayCard.className = `custom-card flex flex-col p-4 transition-all duration-200 ${isRealToday ? 'today-highlight-card shadow-md' : ''}`;

                dayCard.innerHTML = `
                    <div class="flex items-center justify-between border-b pb-2 mb-3 border-gray-200/40">
                        <div class="flex items-center space-x-2">
                            <span class="font-extrabold text-base">${DAYS_NL[i]}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full ${isRealToday ? 'bg-purple-600 text-white font-bold' : 'bg-black/5 font-semibold'}">${dayDate.getDate()} ${dayDate.toLocaleDateString('nl-NL', { month: 'short' })}</span>
                            ${isRealToday ? '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-purple-100 text-purple-700">Vandaag</span>' : ''}
                        </div>
                        <button class="btn-add-item-day text-xs w-6 h-6 rounded-full flex items-center justify-center hover:bg-black/10 transition" data-day="${i}"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div class="item-drop-zone flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 min-h-[50px]" data-day="${i}">
                        ${dayItems.length === 0 ? '<div class="col-span-full py-2 text-center text-xs text-gray-400 opacity-60">Geen items</div>' : ''}
                    </div>
                `;
                container.appendChild(dayCard);

                const dropZone = dayCard.querySelector('.item-drop-zone');
                dayItems.forEach(item => dropZone.appendChild(createItemElement(item)));
                setupDropZone(dropZone, i, weekKey);
            });

            document.getElementById('total-items-badge').innerText = `${state.items.filter(t => t.weekKey === weekKey).length} Items deze week`;
        }

        function createItemElement(item) {
            const itemEl = document.createElement('div');
            itemEl.className = `item-card relative overflow-hidden flex rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow transition-all group ${item.completed ? 'completed-strike' : ''}`;
            itemEl.draggable = true;
            itemEl.dataset.itemId = item.id;

            const catObj = state.settings.categories.find(c => c.id === item.categoryId);
            const catColor = catObj ? catObj.color : '#94a3b8';
            const catName = catObj ? catObj.name : 'Overig';
            const timeDisplay = item.time ? (item.endTime ? `${item.time} - ${item.endTime}` : item.time) : '';

            itemEl.innerHTML = `
                <div class="category-vertical-ribbon px-1 py-2 text-white shrink-0 font-bold" style="background-color: ${catColor};">${escapeHtml(catName)}</div>
                <div class="flex-1 p-3 flex items-start justify-between gap-2 min-w-0">
                    <div class="flex items-start space-x-2.5 min-w-0 flex-1">
                        <button class="btn-toggle-complete mt-0.5 shrink-0 w-4 h-4 rounded border border-gray-400 flex items-center justify-center ${item.completed ? 'bg-emerald-500 border-emerald-500 text-white' : ''}">${item.completed ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}</button>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                ${item.sticker ? `<span class="text-xs font-bold">${item.sticker}</span>` : ''}
                                <span class="font-bold text-xs md:text-sm truncate ${item.completed ? 'line-through text-gray-400' : ''}">${escapeHtml(item.title)}</span>
                            </div>
                            ${timeDisplay ? `<div class="text-[10px] text-gray-500 mt-0.5"><i class="fa-regular fa-clock"></i> ${timeDisplay}</div>` : ''}
                            ${item.notes ? `<p class="text-[10px] text-gray-500 mt-1 line-clamp-1">${escapeHtml(item.notes)}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 opacity-90 shrink-0">
                        <button class="btn-edit-item text-gray-400 hover:text-indigo-600 p-1 opacity-0 group-hover:opacity-100"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button class="btn-delete-item text-gray-400 hover:text-rose-600 p-1 opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                </div>
            `;

            itemEl.querySelector('.btn-toggle-complete').addEventListener('click', (e) => {
                e.stopPropagation();
                item.completed = !item.completed;
                if (item.completed && typeof confetti === 'function') confetti({ particleCount: 25, spread: 40 });
                saveItemToFirebase(item); renderPlanner();
            });
            itemEl.querySelector('.btn-edit-item').addEventListener('click', (e) => { e.stopPropagation(); openItemModal(item); });
            itemEl.querySelector('.btn-delete-item').addEventListener('click', (e) => { e.stopPropagation(); state.items = state.items.filter(t => t.id !== item.id); deleteItemFromFirebase(item.id); renderPlanner(); });
            
            itemEl.addEventListener('dragstart', (e) => { itemEl.classList.add('dragging'); e.dataTransfer.setData('text/plain', item.id); });
            itemEl.addEventListener('dragend', () => itemEl.classList.remove('dragging'));
            return itemEl;
        }

        function setupDropZone(dropZone, dayIndex, weekKey) {
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over-zone'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over-zone'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault(); dropZone.classList.remove('drag-over-zone');
                const item = state.items.find(t => t.id === e.dataTransfer.getData('text/plain'));
                if (item) { item.dayIndex = dayIndex; item.weekKey = weekKey; saveItemToFirebase(item); renderPlanner(); }
            });
        }

        function openItemModal(item = null, defaultDay = 0) {
            const modal = document.getElementById('item-modal');
            document.getElementById('item-form').reset();
            document.querySelectorAll('.sticker-opt').forEach(b => b.classList.remove('ring-2', 'ring-indigo-500'));

            if (item) {
                document.getElementById('modal-item-title').innerText = "Item Bewerken";
                document.getElementById('item-id').value = item.id;
                document.getElementById('item-input-title').value = item.title;
                document.getElementById('item-input-day').value = item.dayIndex;
                document.getElementById('item-input-time').value = item.time || '';
                document.getElementById('item-input-end-time').value = item.endTime || '';
                document.getElementById('item-input-category').value = item.categoryId || '';
                document.getElementById('item-input-priority').value = item.priority || 'none';
                document.getElementById('item-input-sticker').value = item.sticker || '';
                document.getElementById('item-input-notes').value = item.notes || '';
            } else {
                document.getElementById('modal-item-title').innerText = "Nieuw Item Inplannen";
                document.getElementById('item-id').value = '';
                document.getElementById('item-input-day').value = defaultDay;
            }
            modal.classList.remove('hidden');
        }

        function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : ''; }

        function initEventListeners() {
            const addBtnGlobal = document.getElementById('btn-add-item-global');
            if (addBtnGlobal) addBtnGlobal.addEventListener('click', () => openItemModal(null, 0));

            const closeBtn = document.getElementById('btn-close-modal');
            if (closeBtn) closeBtn.addEventListener('click', () => document.getElementById('item-modal').classList.add('hidden'));

            const cancelBtn = document.getElementById('btn-cancel-modal');
            if (cancelBtn) cancelBtn.addEventListener('click', () => document.getElementById('item-modal').classList.add('hidden'));

            const avatarContainer = document.getElementById('header-avatar-container');
            if (avatarContainer) avatarContainer.addEventListener('click', () => document.getElementById('customizer-panel').classList.remove('hidden'));

            const closeCustomizer = document.getElementById('btn-close-customizer');
            if (closeCustomizer) closeCustomizer.addEventListener('click', () => document.getElementById('customizer-panel').classList.add('hidden'));

            const plannerGrid = document.getElementById('planner-grid-container');
            if (plannerGrid) {
                plannerGrid.addEventListener('click', (e) => {
                    const addBtn = e.target.closest('.btn-add-item-day');
                    if (addBtn) openItemModal(null, parseInt(addBtn.dataset.day));
                });
            }

            document.getElementById('btn-prev-week').addEventListener('click', () => { state.currentWeekOffset--; renderPlanner(); });
            document.getElementById('btn-next-week').addEventListener('click', () => { state.currentWeekOffset++; renderPlanner(); });
            document.getElementById('btn-today').addEventListener('click', () => { state.currentWeekOffset = 0; renderPlanner(); });

            document.querySelectorAll('.sticker-opt').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.sticker-opt').forEach(b => b.classList.remove('ring-2', 'ring-indigo-500'));
                    btn.classList.add('ring-2', 'ring-indigo-500');
                    document.getElementById('item-input-sticker').value = btn.dataset.sticker;
                });
            });

            document.getElementById('setting-user-name').addEventListener('input', (e) => {
                state.settings.userName = e.target.value;
                document.getElementById('main-greeting-heading').innerText = getDynamicGreeting(state.settings.userName);
                clearTimeout(window.userNameTimer);
                window.userNameTimer = setTimeout(() => {
                    saveSettingsToFirebase();
                }, 800);
            });

            document.querySelectorAll('.custom-color-picker').forEach(picker => {
                picker.addEventListener('input', () => {
                    const bg = document.getElementById('color-bg').value;
                    const card = document.getElementById('color-card').value;
                    const text = document.getElementById('color-text').value;
                    const accent = document.getElementById('color-accent').value;

                    state.settings.bgColor = bg;
                    state.settings.cardColor = card;
                    state.settings.textColor = text;
                    state.settings.accentColor = accent;
                    state.settings.headerBg1 = accent;
                    state.settings.headerBg2 = accent;

                    applySettingsUI();
                    clearTimeout(window.colorSaveTimer);
                    window.colorSaveTimer = setTimeout(() => {
                        saveSettingsToFirebase();
                    }, 600);
                });
            });

            document.getElementById('item-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const itemId = document.getElementById('item-id').value;
                const startOfWeek = getStartOfWeek(state.currentWeekOffset);
                const itemData = {
                    id: itemId || 'item_' + Date.now(),
                    weekKey: getWeekKey(startOfWeek),
                    title: document.getElementById('item-input-title').value.trim(),
                    dayIndex: parseInt(document.getElementById('item-input-day').value),
                    time: document.getElementById('item-input-time').value,
                    endTime: document.getElementById('item-input-end-time').value,
                    categoryId: document.getElementById('item-input-category').value,
                    priority: document.getElementById('item-input-priority').value,
                    sticker: document.getElementById('item-input-sticker').value,
                    notes: document.getElementById('item-input-notes').value.trim(),
                    completed: itemId ? (state.items.find(t => t.id === itemId)?.completed || false) : false
                };

                if (itemId) {
                    const idx = state.items.findIndex(t => t.id === itemId);
                    if (idx !== -1) state.items[idx] = itemData;
                } else {
                    state.items.push(itemData);
                }

                saveItemToFirebase(itemData);
                renderPlanner();
                document.getElementById('item-modal').classList.add('hidden');
            });

            document.getElementById('btn-add-category').addEventListener('click', () => {
                const nameInp = document.getElementById('new-cat-name');
                const catName = nameInp.value.trim();
                if (catName) {
                    state.settings.categories.push({ id: 'cat_' + Date.now(), name: catName, color: document.getElementById('new-cat-color').value });
                    nameInp.value = '';
                    saveSettingsToFirebase();
                    renderCategoryManager();
                    renderPlanner();
                }
            });

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.preset;
                    if (PRESETS[key]) {
                        state.settings = { ...state.settings, ...PRESETS[key], activePreset: key };
                        applySettingsUI(); renderPlanner(); saveSettingsToFirebase();
                    }
                });
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEventListeners);
        } else {
            initEventListeners();
        }
    </script>
