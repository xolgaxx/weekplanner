<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olgenda - Weekplanner & Agenda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* GGC Minimalistische Stijl & Vormgeving */
        .card-ggc {
            border-radius: 1rem;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }
        .card-ggc:hover {
            box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.08);
        }

        /* Mini Kalender & Verjaardagen Markering */
        .mini-calendar .day.birthday {
            background-color: #fff3bf;
            color: #d9480f;
            font-weight: bold;
            border-radius: 50%;
            border: 1px solid #fcc419;
            position: relative;
        }
        .mini-calendar .day.birthday::after {
            content: "🎂";
            font-size: 0.65em;
            position: absolute;
            top: -6px;
            right: -2px;
        }

        /* Inklapbaar verjaardag menu stijl */
        details summary {
            cursor: pointer;
            list-style: none;
        }
        details summary::-webkit-details-marker {
            display: none;
        }
    </style>
</head>
<body class="bg-[#fcfbf9] text-stone-800 min-h-screen flex flex-col">

    <!-- Auth Scherm (Login / Register) -->
    <div id="auth-screen" class="fixed inset-0 bg-[#fcfbf9] z-50 flex items-center justify-center p-4">
        <div class="card-ggc bg-white p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold tracking-tight text-stone-900 mb-2">Olgenda</h1>
                <p class="text-stone-500 text-sm">Jouw minimalistische digitale levensplanner</p>
            </div>
            <div id="auth-error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg"></div>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">E-mailadres</label>
                    <input type="email5" id="auth-email" required class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-stone-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">Wachtwoord</label>
                    <input type="password" id="auth-password" required class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-stone-400 text-sm">
                </div>
                <div class="flex items-center justify-between text-xs">
                    <button type="button" id="btn-forgot-password" class="text-stone-500 hover:underline">Wachtwoord vergeten?</button>
                    <button type="button" id="auth-toggle-mode" class="text-stone-800 font-semibold hover:underline">Nog geen account? Registreer</button>
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-stone-900 text-white rounded-xl font-medium hover:bg-stone-800 transition shadow-sm text-sm">Inloggen</button>
            </form>
        </div>
    </div>

    <!-- Hoofdapplicatie -->
    <div id="app-container" class="flex-1 flex flex-col hidden">
        <!-- Header -->
        <header class="bg-white border-b border-stone-100 py-4 px-6 flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center space-x-4">
                <img id="header-logo" src="Olgenda-licht-thema.png" alt="Olgenda Logo" class="h-8 object-contain">
                <div class="flex items-center space-x-2 border-l border-stone-200 pl-4">
                    <img id="header-avatar-img" src="" alt="Avatar" class="w-8 h-8 rounded-full object-cover border border-stone-200 hidden">
                    <span id="header-username" class="text-sm font-semibold text-stone-700"></span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="btn-settings-open" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl transition">Instellingen & Stijl</button>
                <button id="btn-logout" class="px-3 py-2 text-xs font-semibold uppercase tracking-wider text-stone-400 hover:text-red-600 transition">Uitloggen</button>
            </div>
        </header>

        <!-- Dashboard / Layout -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Linker/Midden Kolom: Weekplanner (3 kolommen breed op lg) -->
            <div class="lg:col-span-3 flex flex-col space-y-6">
                <!-- Week Navigatie & Filter -->
                <div class="card-ggc bg-white p-4 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center space-x-3">
                        <button id="btn-prev-week" class="p-2 rounded-lg hover:bg-stone-100 text-stone-600 transition">◀</button>
                        <h2 id="current-week-label" class="text-base font-bold text-stone-800">Week --</h2>
                        <button id="btn-next-week" class="p-2 rounded-lg hover:bg-stone-100 text-stone-600 transition">▶</button>
                        <button id="btn-today" class="px-3 py-1.5 text-xs font-medium bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-lg transition">Vandaag</button>
                    </div>
                    <div class="flex items-center space-x-2">
                        <select id="category-filter" class="px-3 py-1.5 text-xs rounded-lg border border-stone-200 bg-stone-50 focus:outline-none">
                            <option value="">Alle categorieën</option>
                        </select>
                        <button id="btn-new-item" class="px-4 py-1.5 bg-stone-900 text-white rounded-lg text-xs font-medium hover:bg-stone-800 transition shadow-sm">+ Nieuw Item</button>
                    </div>
                </div>

                <!-- Dagen Raster -->
                <div id="week-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dagen worden dynamisch ingeladen via JS -->
                </div>
            </div>

            <!-- Rechter Kolom: Widgets Beheer & Widgets -->
            <div class="lg:col-span-1 flex flex-col space-y-6">
                <!-- Widgets Container -->
                <div id="widgets-container" class="flex flex-col space-y-6">
                    <!-- Dynamische widgets zoals notitieblok, checklist, habits en mini-kalender -->
                </div>
            </div>
        </main>
    </div>

    <!-- Instellingen Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="card-ggc bg-white max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-stone-100 pb-3">
                <h3 class="text-lg font-bold text-stone-800">Instellingen & Stijl</h3>
                <button id="btn-settings-close" class="text-stone-400 hover:text-stone-700 font-bold">✕</button>
            </div>
            <div class="space-y-6 text-sm">
                <!-- Profiel -->
                <div>
                    <h4 class="font-semibold text-stone-700 mb-2">Profiel</h4>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-stone-500 mb-1">Jouw Naam</label>
                            <input type="text" id="setting-username" class="w-full px-3 py-2 rounded-lg border border-stone-200 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-stone-500 mb-1">Profielfoto Uploaden</label>
                            <input type="file" id="setting-avatar-input" accept="image/*" class="w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200">
                        </div>
                    </div>
                </div>
                <!-- Thema / Kleuren -->
                <div>
                    <h4 class="font-semibold text-stone-700 mb-2">Thema & Kleurenpalet</h4>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" class="theme-preset-btn p-3 rounded-xl border border-stone-200 text-left hover:border-stone-400 transition" data-theme="ggc">
                            <div class="font-medium text-stone-800">GGC Minimal</div>
                            <div class="text-xs text-stone-500">Zacht zand & beige</div>
                        </button>
                        <button type="button" class="theme-preset-btn p-3 rounded-xl border border-stone-200 text-left hover:border-stone-400 transition" data-theme="emmy">
                            <div class="font-medium text-stone-800">Emmy</div>
                            <div class="text-xs text-stone-500">Warm roze & terracotta</div>
                        </button>
                    </div>
                </div>
                <!-- Widgets Beheer -->
                <div>
                    <h4 class="font-semibold text-stone-700 mb-2">Widgets Beheer</h4>
                    <p class="text-xs text-stone-500 mb-3">Vink aan welke widgets je wilt tonen en geef ze een eigen naam:</p>
                    <div id="widgets-beheer-container" class="space-y-2">
                        <!-- Wordt dynamisch gevuld -->
                    </div>
                </div>
            </div>
            <div class="mt-6 pt-4 border-t border-stone-100 flex justify-end space-x-3">
                <button id="btn-settings-save" class="px-4 py-2 bg-stone-900 text-white rounded-xl text-xs font-medium hover:bg-stone-800 transition">Opslaan</button>
            </div>
        </div>
    </div>

    <!-- Item Modal (Toevoegen/Bewerken met 5-minuten tijdstappen) -->
    <div id="item-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="card-ggc bg-white max-w-md w-full p-6">
            <h3 id="item-modal-title" class="text-lg font-bold text-stone-800 mb-4">Nieuw Item Inplannen</h3>
            <form id="item-form" class="space-y-4 text-sm">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">Onderwerp / Taak</label>
                    <input type="text" id="item-title" required class="w-full px-3 py-2 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-stone-400">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">Datum</label>
                        <input type="date" id="item-date" required class="w-full px-3 py-2 rounded-xl border border-stone-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">Starttijd (per 5 min)</label>
                        <input type="time" id="item-time" step="300" class="w-full px-3 py-2 rounded-xl border border-stone-200">
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" id="item-modal-cancel" class="px-4 py-2 text-stone-600 hover:bg-stone-100 rounded-xl text-xs font-medium">Annuleren</button>
                    <button type="submit" class="px-4 py-2 bg-stone-900 text-white rounded-xl text-xs font-medium hover:bg-stone-800">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts (Mock/App Logica met veilige getStartOfWeek en ingeklapt verjaardag menu) -->
    <script>
        // Veilige datumfunctie zonder date mutation bugs
        function getStartOfWeek(offset = 0) {
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(now.getFullYear(), now.getMonth(), diff + (offset * 7));
            monday.setHours(0,0,0,0);
            return monday;
        }

        // Basisapplicatie staat en initialisatie
        let state = {
            currentWeekOffset: 0,
            settings: { username: "Jouw Naam", theme: "ggc", avatarImg: "" },
            widgets: [
                { id: 'notepad', type: 'notepad', title: 'Notitieblok', enabled: true },
                { id: 'checklist', type: 'checklist', title: 'Boodschappenlijst', enabled: true },
                { id: 'miniCalendar', type: 'miniCalendar', title: 'Maandkalender', enabled: true }
            ],
            birthdays: [
                { day: 15, month: 5, name: "Lisa" },
                { day: 29, month: 9, name: "Mark" }
            ],
            items: []
        };

        // Eenvoudige UI demonstratie render functie voor de mini-kalender en widgets
        function renderWidgets() {
            const container = document.getElementById('widgets-container');
            container.innerHTML = '';

            state.widgets.filter(w => w.enabled).forEach(widget => {
                const card = document.createElement('div');
                card.className = 'card-ggc bg-white p-4';
                
                if (widget.type === 'miniCalendar') {
                    const now = new Date();
                    const monthNames = ["Januari", "Februari", "Maart", "April", "Mei", "Juni", "Juli", "Augustus", "September", "Oktober", "November", "December"];
                    
                    let daysHTML = '';
                    for (let i = 1; i <= 30; i++) {
                        const match = state.birthdays.find(b => b.day === i && b.month === (now.getMonth() + 1));
                        const birthdayClass = match ? 'birthday' : '';
                        const titleAttr = match ? `title="Jarig: ${match.name}"` : '';
                        daysHTML += `<div class="aspect-square flex items-center justify-center text-xs rounded-lg hover:bg-stone-100 cursor-pointer ${birthdayClass}" ${titleAttr}>${i}</div>`;
                    }

                    card.innerHTML = `
                        <h3 class="font-bold text-stone-800 mb-3">${monthNames[now.getMonth()]} ${now.getFullYear()}</h3>
                        <div class="mini-calendar grid grid-cols-7 gap-1 text-center text-stone-600 mb-4">
                            ${daysHTML}
                        </div>
                        <details class="border-t border-stone-100 pt-3">
                            <summary class="text-xs font-semibold text-stone-500 hover:text-stone-800 transition">➕ Verjaardag toevoegen</summary>
                            <div class="mt-3 space-y-2">
                                <input type="text" placeholder="Naam..." class="w-full px-2 py-1.5 text-xs rounded-lg border border-stone-200">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="number" placeholder="Dag" min="1" max="31" class="px-2 py-1.5 text-xs rounded-lg border border-stone-200">
                                    <input type="number" placeholder="Maand" min="1" max="12" class="px-2 py-1.5 text-xs rounded-lg border border-stone-200">
                                </div>
                                <button class="w-full py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-lg text-xs font-medium">Toevoegen</button>
                            </div>
                        </details>
                    `;
                } else {
                    card.innerHTML = `
                        <h3 class="font-bold text-stone-800 mb-3">${widget.title}</h3>
                        <p class="text-xs text-stone-400">Widget inhoud (${widget.type})</p>
                    `;
                }
                container.appendChild(card);
            });
        }

        // Event listeners simulatie voor instellingen en modals
        document.getElementById('btn-settings-open').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.remove('hidden');
            renderWidgetsBeheer();
        });
        document.getElementById('btn-settings-close').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.add('hidden');
        });

        function renderWidgetsBeheer() {
            const container = document.getElementById('widgets-beheer-container');
            container.innerHTML = '';
            state.widgets.forEach((widget, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center space-x-2';
                row.innerHTML = `
                    <input type="checkbox" ${widget.enabled ? 'checked' : ''} onchange="state.widgets[${index}].enabled = this.checked">
                    <input type="text" value="${widget.title}" oninput="state.widgets[${index}].title = this.value" class="flex-1 px-3 py-1.5 rounded-lg border border-stone-200 text-xs">
                `;
                container.appendChild(row);
            });
        }

        document.getElementById('btn-settings-save').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.add('hidden');
            renderWidgets();
        });

        // Simuleer direct inloggen voor preview
        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            renderWidgets();
        });
    </script>
</body>
</html>
